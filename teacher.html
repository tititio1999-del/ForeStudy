и<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForeStudy — Учитель</title>
    <style>
        :root {
            --bg: #f5f7fb; --surface: #fff; --text: #1a1a2e; --text-secondary: #555;
            --accent: #2e7d32; --accent-hover: #1b5e20; --border: #e2e8f0;
            --shadow: 0 4px 12px rgba(0,0,0,0.08); --header-bg: #ffffffcc; --backdrop: blur(10px);
        }
        [data-theme="dark"] {
            --bg: #0f172a; --surface: #1e293b; --text: #e2e8f0; --text-secondary: #94a3b8;
            --accent: #4caf50; --accent-hover: #388e3c; --border: #334155;
            --shadow: 0 4px 20px rgba(0,0,0,0.4); --header-bg: #1e293bcc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        .header { position: sticky; top: 0; z-index: 50; background: var(--header-bg); backdrop-filter: var(--backdrop); border-bottom: 1px solid var(--border); box-shadow: var(--shadow); padding: 0.5rem 1.5rem; }
        .top-line { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
        .logo { font-weight: 700; font-size: 1.8rem; color: #2e7d32; display: flex; align-items: center; gap: 0.5rem; }
        [data-theme="dark"] .logo { color: #4caf50; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
        .status-dot.online { background: #10b981; } .status-dot.offline { background: #ef4444; }
        .theme-toggle { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text); }
        .nav { display: flex; gap: 1rem; margin-top: 0.5rem; flex-wrap: wrap; }
        .nav-btn { background: none; border: none; padding: 0.5rem 1.2rem; border-radius: 2rem; font-weight: 600; cursor: pointer; color: var(--text); }
        .nav-btn.active { background: var(--accent); color: white; }
        .container { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; flex: 1; }
        .btn { padding: 0.5rem 1.2rem; border-radius: 2rem; border: none; font-weight: 600; cursor: pointer; background: var(--accent); color: white; font-size: 0.9rem; transition: background 0.2s; }
        .btn:hover { background: var(--accent-hover); }
        .btn.outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
        .btn.outline:hover { background: var(--accent); color: white; }
        .btn.danger { background: #b91c1c; }
        .btn.small { padding: 0.3rem 0.8rem; font-size: 0.8rem; }
        .section-title { font-size: 1.3rem; font-weight: 700; margin: 1.5rem 0 1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); text-align: left; }
        th { color: var(--text-secondary); font-weight: 600; }
        .deleted-row { opacity: 0.5; background: var(--bg); }
        .menu-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text); padding: 0.2rem 0.5rem; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; right: 0; background: var(--surface); min-width: 160px; box-shadow: var(--shadow); border-radius: 12px; border: 1px solid var(--border); z-index: 60; }
        .dropdown-content button { display: block; width: 100%; padding: 0.5rem 1rem; background: none; border: none; text-align: left; color: var(--text); cursor: pointer; font-size: 0.9rem; }
        .dropdown-content button:hover { background: var(--bg); }
        .empty-message { color: var(--text-secondary); font-style: italic; padding: 2rem 0; text-align: center; }
        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 1rem; }
        .modal-content { background: var(--surface); padding: 2rem; border-radius: 16px; max-width: 700px; width: 100%; max-height: 85vh; overflow-y: auto; position: relative; }
        .modal-close { position: absolute; top: 0.5rem; right: 0.8rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text); }
        .question-block { border: 2px solid var(--accent); border-radius: 12px; padding: 1.2rem; margin-bottom: 1.2rem; background: var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        [data-theme="dark"] .question-block { border-color: #4caf50; background: #1a2a1a; }
        .question-separator { height: 1px; background: var(--border); margin: 0.8rem 0; }
        .question-label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        .question-actions { margin-top: 1rem; display: flex; justify-content: flex-end; }
        .option-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.3rem 0; }
        .option-row input[type="radio"] { width: auto; }
        textarea, input[type="text"], input[type="number"], select { border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem; background: var(--surface); color: var(--text); font-family: inherit; width: 100%; }
        .progress-bar { height: 8px; border-radius: 4px; background: var(--border); margin: 0.3rem 0; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 4px; background: var(--accent); }
        .error-progress-fill { background: #b91c1c; }
        .deficit-progress-fill { background: #eab308; }
        .question-progress-item { display: flex; align-items: center; gap: 0.5rem; margin: 0.4rem 0; }
        .topic-header { cursor: pointer; padding: 0.5rem; border: 1px solid var(--border); border-radius: 8px; margin: 0.5rem 0; display: flex; justify-content: space-between; align-items: center; }
        .topic-header:hover { background: var(--bg); }
        .question-link { cursor: pointer; }
        .question-link:hover { text-decoration: underline; }
        .error-box { background: #fee; border: 1px solid #fcc; color: #c00; padding: 1rem; border-radius: 8px; margin: 1rem 0; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; }
        [data-theme="dark"] .error-box { background: #441111; border-color: #661111; color: #ff6666; }
        .img-preview-circle { width: 100px; height: 100px; border-radius: 50%; background-size: cover; background-position: center; margin: 0.5rem 0; border: 2px solid var(--accent); display: inline-block; }
        .settings-section { width: 100%; }
        .settings-section h3 { padding: 0.8rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin: 0; }
        .settings-section .section-content { padding: 1.5rem; border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; }
        .img-controls { margin-top: 0.5rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
        .settings-section { margin-bottom: 2rem; }
        .settings-section h3.section-toggle { padding: 0.8rem 1.2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin: 0 0 0.5rem 0; width: 100%; font-size: 1.1rem; cursor: pointer; user-select: none; }
        .settings-section .section-content { padding: 1.5rem; border: 1px solid var(--border); border-radius: 8px; margin-top: -2px; background: var(--surface); }
        .settings-section { width: 100%; }
        .history-block { border-bottom: 1px solid var(--border); padding: 0.5rem 0; margin-bottom: 0.5rem; }
        .history-answer { margin: 0.3rem 0; font-size: 0.95rem; line-height: 1.4; }
        .diff-correct { background-color: #d4edda; padding: 0; border-radius: 2px; }
        .diff-wrong { background-color: #f8d7da; padding: 0; border-radius: 2px; }
        .history-answer span { font-size: inherit; font-family: inherit; letter-spacing: 0; }
        
        .section-toggle { cursor: pointer; user-select: none; }
        .section-content { display: none; margin-top: 1.5rem; }
        @media (max-width: 600px) { .header { padding: 0.5rem 1rem; } .logo { font-size: 1.4rem; } .container { padding: 0 0.5rem; } }
        
        .resizable-image-container { display:inline-block; position:relative; max-width:100%; }
        .resizable-image { display:block; max-width:100%; height:auto; border-radius:8px; border:1px solid var(--border); }
        .resize-handle { position:absolute; bottom:0; right:0; width:16px; height:16px; cursor:nwse-resize; background:rgba(0,0,0,0.3); border-radius:0 0 8px 0; }
        .resize-handle::after { content:''; position:absolute; bottom:3px; right:3px; width:8px; height:8px; border-right:2px solid white; border-bottom:2px solid white; }
        
        /* Стили для призраков */
        .ghost-row { background: rgba(155, 89, 182, 0.08); }
        .ghost-row td:first-child { color: #8e44ad; }
        [data-theme="dark"] .ghost-row { background: rgba(155, 89, 182, 0.15); }
        [data-theme="dark"] .ghost-row td:first-child { color: #bb8fce; }
        
        /* Стили для auditLog */
        .audit-entry { border-left: 3px solid var(--accent); padding: 0.6rem 1rem; margin: 0.5rem 0; background: var(--surface); border-radius: 0 8px 8px 0; }
        .audit-entry.levelUp { border-left-color: #f59e0b; }
        .audit-entry.manual { border-left-color: #8b5cf6; }
        .audit-entry .audit-time { font-size: 0.8rem; color: var(--text-secondary); }
        .audit-entry .audit-desc { margin: 0.2rem 0; }
        .audit-entry .audit-badge { display: inline-block; font-size: 0.7rem; padding: 0.1rem 0.5rem; border-radius: 10px; font-weight: 600; }
        .audit-entry .audit-badge.levelUp { background: #fef3c7; color: #92400e; }
        .audit-entry .audit-badge.manual { background: #ede9fe; color: #5b21b6; }
        .audit-entry.levelDown { border-left-color: #ef4444; }
        .audit-entry .audit-badge.levelDown { background: #fee2e2; color: #991b1b; }
        [data-theme="dark"] .audit-entry .audit-badge.levelUp { background: #78350f; color: #fde68a; }
        [data-theme="dark"] .audit-entry .audit-badge.manual { background: #3b0764; color: #c4b5fd; }
        [data-theme="dark"] .audit-entry .audit-badge.levelDown { background: #7f1d1d; color: #fca5a5; }
        .audit-entry.applied { border-left-color: #10b981; }
        .audit-entry .audit-badge.applied { background: #d1fae5; color: #065f46; }
        [data-theme="dark"] .audit-entry .audit-badge.applied { background: #064e3b; color: #6ee7b7; }
        .audit-applied-mark { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.75rem; color: #10b981; font-weight: 600; margin-top: 0.3rem; }
        
        /* Стили для календаря статистики по датам */
        .date-stats-student { margin-bottom: 1rem; }
        .date-stats-student .student-header { cursor: pointer; padding: 0.8rem 1.2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; user-select: none; }
        .date-stats-student .student-header:hover { background: var(--bg); }
        .date-stats-student .student-content { display: none; padding: 1.5rem; border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; background: var(--surface); }
        .calendar-nav { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; justify-content: center; }
        .calendar-nav button { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem 0.8rem; cursor: pointer; color: var(--text); font-size: 1rem; }
        .calendar-nav button:hover { background: var(--bg); }
        .calendar-nav span { font-weight: 600; font-size: 1.1rem; min-width: 180px; text-align: center; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 0.5rem; }
        .calendar-grid .day-header { text-align: center; font-weight: 600; font-size: 0.8rem; color: var(--text-secondary); padding: 0.3rem 0; }
        .calendar-grid .day-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; position: relative; transition: transform 0.15s, box-shadow 0.15s; min-height: 36px; }
        .calendar-grid .day-cell:hover { transform: scale(1.1); box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 2; }
        .calendar-grid .day-cell.other-month { opacity: 0.3; }
        .calendar-grid .day-cell.today { outline: 2px solid var(--accent); outline-offset: -2px; }
        .calendar-grid .day-cell .day-number { position: relative; z-index: 1; text-shadow: 0 0 3px rgba(255,255,255,0.8); }
        [data-theme="dark"] .calendar-grid .day-cell .day-number { text-shadow: 0 0 3px rgba(0,0,0,0.8); }
        /* Цвета для ячеек в зависимости от процента выполнения нормы */
        .calendar-grid .day-cell.level-0 { background: #fef3c7; color: #92400e; }
        .calendar-grid .day-cell.level-1 { background: #fde68a; color: #92400e; }
        .calendar-grid .day-cell.level-2 { background: #fcd34d; color: #78350f; }
        .calendar-grid .day-cell.level-3 { background: #bbf7d0; color: #166534; }
        .calendar-grid .day-cell.level-4 { background: #86efac; color: #14532d; }
        .calendar-grid .day-cell.level-5 { background: #4ade80; color: #052e16; }
        .calendar-grid .day-cell.level-6 { background: #22c55e; color: #052e16; }
        .calendar-grid .day-cell.level-7 { background: #16a34a; color: #f0fdf4; }
        .calendar-grid .day-cell.level-8 { background: #15803d; color: #f0fdf4; }
        .calendar-grid .day-cell.no-data { background: transparent; color: var(--text-secondary); cursor: default; }
        .calendar-grid .day-cell.no-data:hover { transform: none; box-shadow: none; }
        /* Боковая панель статистики */
        .day-stats-panel { position: fixed; top: 0; right: 0; width: 320px; height: 100vh; background: var(--surface); border-left: 1px solid var(--border); box-shadow: -4px 0 20px rgba(0,0,0,0.1); z-index: 200; padding: 1.5rem; overflow-y: auto; transform: translateX(100%); transition: transform 0.3s ease; }
        .day-stats-panel.open { transform: translateX(0); }
        .day-stats-panel .panel-close { position: absolute; top: 0.8rem; right: 0.8rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text); }
        .day-stats-panel h3 { margin-bottom: 1rem; }
        .day-stats-panel .stat-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
        .day-stats-panel .stat-row .label { color: var(--text-secondary); }
        .day-stats-panel .stat-row .value { font-weight: 600; }
        .day-stats-panel .stat-row .value.correct { color: #16a34a; }
        .day-stats-panel .stat-row .value.wrong { color: #dc2626; }
        /* Tooltip */
        .day-cell-tooltip { position: fixed; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.8rem; box-shadow: var(--shadow); font-size: 0.85rem; z-index: 300; pointer-events: none; white-space: nowrap; }
        .day-cell-tooltip .tooltip-title { font-weight: 600; margin-bottom: 0.2rem; }
        .day-cell-tooltip .tooltip-row { display: flex; gap: 0.5rem; }
        .day-cell-tooltip .tooltip-row .correct { color: #16a34a; }
        .day-cell-tooltip .tooltip-row .wrong { color: #dc2626; }
        /* Поле нормы */
        .norm-input { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
        .norm-input label { font-size: 0.9rem; color: var(--text-secondary); }
        .norm-input input { width: 80px; padding: 0.3rem 0.5rem; border: 1px solid var(--border); border-radius: 6px; text-align: center; }
        .norm-input button { padding: 0.3rem 0.8rem; }

        /* ── Словарик ─────────────────────────────────────────── */
        .dict-head { text-align: center; margin-bottom: 1.5rem; }
        .dict-head h2 { font-size: 1.8rem; margin-bottom: 0.3rem; }
        .dict-head p { color: var(--text-secondary); font-size: 0.95rem; }
        .dict-search {
            width: 100%; padding: 0.8rem 1.2rem; border-radius: 2rem;
            border: 2px solid var(--border); background: var(--surface); color: var(--text);
            font-size: 1rem; outline: none; transition: border-color 0.2s; margin-bottom: 1rem;
        }
        .dict-search:focus { border-color: var(--accent); }
        .dict-filter-row { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1.2rem; }
        .dict-abc { display: flex; flex-wrap: wrap; gap: 0.3rem; justify-content: center; margin-bottom: 1.2rem; }
        .dict-letter {
            width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
            background: var(--surface); color: var(--text); font-weight: 600; font-size: 0.9rem;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .dict-letter:hover { border-color: var(--accent); color: var(--accent); }
        .dict-letter.active { background: var(--accent); color: white; border-color: var(--accent); }
        .dict-letter.disabled { opacity: 0.35; cursor: default; }
        .dict-letter.disabled:hover { border-color: var(--border); color: var(--text); }
        .dict-count { text-align: center; color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1rem; }
        .dict-topic { margin: 1.2rem 0 0.5rem; }
        .dict-topic-toggle {
            width: 100%; display: flex; align-items: center; gap: 0.6rem;
            font-size: 1.3rem; font-weight: 700; color: var(--accent);
            background: none; border: none; border-bottom: 2px solid var(--border);
            padding: 0.5rem 0.3rem; cursor: pointer; text-align: left;
            transition: color 0.2s, border-color 0.2s;
        }
        .dict-topic-toggle:hover { color: var(--accent-hover); border-color: var(--accent); }
        .dict-topic-arrow { display: inline-block; transition: transform 0.2s; font-size: 1rem; flex-shrink: 0; }
        .dict-topic.collapsed .dict-topic-arrow { transform: rotate(-90deg); }
        .dict-topic-count { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-left: auto; }
        .dict-topic.collapsed .dict-topic-words { display: none; }
        .word-card { border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.5rem; margin: 0.7rem 0; background: var(--surface); box-shadow: var(--shadow); transition: border-color 0.2s, opacity 0.2s; }
        .word-card.learned { opacity: 0.75; }
        .word-card.learned .word-en { text-decoration: line-through; text-decoration-color: var(--accent); }
        .word-row { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
        .word-en { font-size: 1.25rem; font-weight: 700; color: var(--text); }
        .word-ru { font-size: 1.05rem; color: var(--text-secondary); }
        .word-trans { color: var(--text-secondary); font-size: 0.95rem; font-style: italic; }
        .word-speak {
            width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--accent);
            background: transparent; color: var(--accent); font-size: 1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0;
        }
        .word-speak:hover { background: var(--accent); color: white; }
        .level-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; border-radius: 50%; font-weight: 700; font-size: 0.8rem;
            color: white; flex-shrink: 0;
        }
        .level-A1 { background: #4caf50; } .level-A2 { background: #8bc34a; }
        .level-B1 { background: #ff9800; } .level-B2 { background: #ff5722; }
        .level-C1 { background: #9c27b0; } .level-C2 { background: #3f51b5; }
        .level-A0 { background: #009688; }
        .topic-tag {
            display: inline-flex; align-items: center; padding: 0.15rem 0.7rem; border-radius: 2rem;
            background: #e8f5e9; color: #2e7d32; font-size: 0.75rem; font-weight: 600; white-space: nowrap;
        }
        [data-theme="dark"] .topic-tag { background: #1a3a2a; color: #4caf50; }
        .word-status {
            display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.8rem;
            border-radius: 2rem; border: 1px solid var(--border); background: transparent;
            color: var(--text-secondary); font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .word-status:hover { border-color: var(--accent); }
        .word-status.learned { background: #e8f5e9; color: #2e7d32; border-color: #4caf50; }
        [data-theme="dark"] .word-status.learned { background: #1a3a2a; color: #4caf50; }
        .word-delete {
            display: inline-flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border);
            background: transparent; color: #b91c1c; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
        }
        .word-delete:hover { background: #b91c1c; color: white; border-color: #b91c1c; }
        .word-note { margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px dashed var(--border); color: var(--text-secondary); font-size: 0.85rem; line-height: 1.5; }
        .word-note strong { color: var(--text); }
        .word-meta { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-left: auto; }
        .dict-server-badge { display: inline-flex; align-items: center; padding: 0.15rem 0.6rem; border-radius: 2rem; background: #fff3cd; color: #856404; font-size: 0.7rem; font-weight: 600; white-space: nowrap; }
        [data-theme="dark"] .dict-server-badge { background: #3a2f12; color: #e6c864; }
        .dict-voice-badge { display: inline-flex; align-items: center; padding: 0.15rem 0.6rem; border-radius: 2rem; background: #e3f2fd; color: #1565c0; font-size: 0.7rem; font-weight: 600; white-space: nowrap; }
        [data-theme="dark"] .dict-voice-badge { background: #0d2137; color: #64b5f6; }
        .sd-status { display: inline-flex; align-items: center; padding: 0.12rem 0.6rem; border-radius: 2rem; font-size: 0.7rem; font-weight: 700; white-space: nowrap; }
        .sd-yes { background: #e8f5e9; color: #2e7d32; }
        [data-theme="dark"] .sd-yes { background: #1a3a2a; color: #4caf50; }
        .sd-no { background: #ffebee; color: #b91c1c; }
        [data-theme="dark"] .sd-no { background: #3a1a1a; color: #ff8a80; }
    </style>
</head>
<body>
    <header class="header">
        <div class="top-line"><div class="logo"><span class="status-dot" id="connectionDot"></span> ForeStudy · Учитель</div><button id="themeToggle" class="theme-toggle">🌙</button></div>
        <nav class="nav">
            <button class="nav-btn active" data-tab="students">👥 Ученики</button>
            <button class="nav-btn" data-tab="topics">📚 Темы</button>
            <button class="nav-btn" data-tab="dictionary">📖 Словарик</button>
            <button class="nav-btn" data-tab="settings">⚙️ Настройки</button>
            <button class="nav-btn" data-tab="questions">❓ Вопросы</button>
            <button class="nav-btn" data-tab="auditLog">📋 Журнал</button>
            <button class="nav-btn" data-tab="dateStats">📅 Статистика по датам</button>
        </nav>
    </header>
    <main class="container" id="app"></main>

    <script src="config.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove, get, update } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

        if (!window.firebaseConfig) { alert('config.js не загружен'); throw new Error('Missing config'); }
        const app = initializeApp(window.firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth();
        await signInAnonymously(auth);
        console.log('✅ Учитель аутентифицирован анонимно');
        

        const connectionDot = document.getElementById('connectionDot');
        onValue(ref(db, '.info/connected'), snap => { connectionDot.className = 'status-dot ' + (snap.val() === true ? 'online' : 'offline'); });

        // ========== НОВАЯ ЛОГИКА ВХОДА УЧИТЕЛЯ ==========
        let teacherId = null;
        
        function showTeacherLoginDialog() {
            return new Promise((resolve) => {
                const backdrop = document.createElement('div');
                backdrop.className = 'modal-backdrop';
                backdrop.style.zIndex = '10000';
                
                const modalDiv = document.createElement('div');
                modalDiv.className = 'modal-content';
                modalDiv.style.maxWidth = '400px';
                modalDiv.style.textAlign = 'center';
                modalDiv.innerHTML = `
                    <h3>🔐 Вход для учителя</h3>
                    <p style="margin:1rem 0;">Введите ID учителя или оставьте поле пустым для создания нового:</p>
                    <input type="text" id="teacherIdInput" placeholder="ID учителя (например, tch_...)" style="width:100%; padding:0.8rem; margin-bottom:1rem; border-radius:8px; border:1px solid #ccc;">
                    <div style="display:flex; gap:0.5rem;">
                        <button id="loginBtn" class="btn">Войти / Создать</button>
                    </div>
                    <div id="errMsg" style="color:#ef4444; margin-top:0.8rem;"></div>
                `;
                backdrop.appendChild(modalDiv);
                document.body.appendChild(backdrop);
                
                const input = modalDiv.querySelector('#teacherIdInput');
                const loginBtn = modalDiv.querySelector('#loginBtn');
                const errMsg = modalDiv.querySelector('#errMsg');
                
                function submit() {
                    let id = input.value.trim();
                    if (id === '') {
                        id = 'tch_' + Math.random().toString(36).substr(2,8) + Date.now().toString(36).substr(2,4);
                    }
                    document.body.removeChild(backdrop);
                    resolve(id);
                }
                
                loginBtn.onclick = submit;
                input.addEventListener('keypress', (e) => { if (e.key === 'Enter') submit(); });
                backdrop.addEventListener('click', (e) => { if (e.target === backdrop) { document.body.removeChild(backdrop); resolve(null); } });
            });
        }
        
        teacherId = await showTeacherLoginDialog();
        if (!teacherId) {
            document.getElementById('app').innerHTML = '<div class="empty-message" style="text-align:center; margin-top:3rem;"><h2>❌ Доступ запрещён</h2></div>';
            throw new Error('Unauthorized');
        }
        localStorage.setItem('teacher_id', teacherId);
        // ========== УСТАНОВКА / ПРОВЕРКА ПАРОЛЯ УЧИТЕЛЯ ==========
        async function hashPassword(pwd, salt) {
            const encoder = new TextEncoder();
            const data = encoder.encode(pwd + salt);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
        }

        function showPasswordDialog(isSetup) {
            return new Promise((resolve) => {
                const backdrop = document.createElement('div');
                backdrop.className = 'modal-backdrop';
                backdrop.style.zIndex = '10001';
                
                const modalDiv = document.createElement('div');
                modalDiv.className = 'modal-content';
                modalDiv.style.maxWidth = '400px';
                modalDiv.style.textAlign = 'center';
                
                if (isSetup) {
                    modalDiv.innerHTML = `
                        <h3>🔐 Установка пароля</h3>
                        <p style="margin:1rem 0;">Придумайте пароль для входа в панель учителя.<br><strong>Не потеряйте его!</strong></p>
                        <input type="password" id="pwd1" placeholder="Пароль" style="width:100%; padding:0.8rem; margin-bottom:0.8rem; border-radius:8px; border:1px solid #ccc;">
                        <input type="password" id="pwd2" placeholder="Подтвердите пароль" style="width:100%; padding:0.8rem; margin-bottom:1rem; border-radius:8px; border:1px solid #ccc;">
                        <button id="okBtn" class="btn" style="width:100%;">Сохранить</button>
                        <div id="errMsg" style="color:#ef4444; margin-top:0.8rem;"></div>
                    `;
                } else {
                    modalDiv.innerHTML = `
                        <h3>🔐 Вход для учителя</h3>
                        <p style="margin:1rem 0;">Введите пароль:</p>
                        <input type="password" id="pwd1" placeholder="Пароль" style="width:100%; padding:0.8rem; margin-bottom:1rem; border-radius:8px; border:1px solid #ccc;">
                        <button id="okBtn" class="btn" style="width:100%;">Войти</button>
                        <div id="errMsg" style="color:#ef4444; margin-top:0.8rem;"></div>
                    `;
                }
                
                backdrop.appendChild(modalDiv);
                document.body.appendChild(backdrop);
                
                const pwd1 = modalDiv.querySelector('#pwd1');
                const pwd2 = modalDiv.querySelector('#pwd2');
                const okBtn = modalDiv.querySelector('#okBtn');
                const errMsg = modalDiv.querySelector('#errMsg');
                
                function submit() {
                    const pwd = pwd1.value;
                    if (isSetup) {
                        const pwdConfirm = pwd2 ? pwd2.value : '';
                        if (!pwd) {
                            errMsg.textContent = 'Введите пароль';
                            return;
                        }
                        if (pwd !== pwdConfirm) {
                            errMsg.textContent = 'Пароли не совпадают';
                            return;
                        }
                        if (pwd.length < 4) {
                            errMsg.textContent = 'Пароль должен быть не менее 4 символов';
                            return;
                        }
                        document.body.removeChild(backdrop);
                        resolve(pwd);
                    } else {
                        if (!pwd) {
                            errMsg.textContent = 'Введите пароль';
                            return;
                        }
                        document.body.removeChild(backdrop);
                        resolve(pwd);
                    }
                }
                
                okBtn.onclick = submit;
                pwd1.addEventListener('keypress', (e) => { if (e.key === 'Enter') submit(); });
                if (pwd2) pwd2.addEventListener('keypress', (e) => { if (e.key === 'Enter') submit(); });
                backdrop.addEventListener('click', (e) => { if (e.target === backdrop) { document.body.removeChild(backdrop); resolve(null); } });
            });
        }

        async function initAuth() {
            const saltSnap = await get(ref(db, `teachers/${teacherId}/_salt`));
            const hashSnap = await get(ref(db, `teachers/${teacherId}/_hash`));
            
            // Если пароля нет (новый учитель или старый без пароля) — предлагаем установить
            if (!saltSnap.exists() || !hashSnap.exists()) {
                const newPassword = await showPasswordDialog(true);
                if (!newPassword) return false;
                const salt = Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
                const hash = await hashPassword(newPassword, salt);
                await set(ref(db, `teachers/${teacherId}/_salt`), salt);
                await set(ref(db, `teachers/${teacherId}/_hash`), hash);
                sessionStorage.setItem('teacher_auth', 'true');
                return true;
            }
            
            // Проверяем, авторизован ли уже в этой сессии
            const isAuth = sessionStorage.getItem('teacher_auth');
            if (isAuth === 'true') return true;
            
            // Запрашиваем пароль
            const pwd = await showPasswordDialog(false);
            if (!pwd) return false;
            const salt = saltSnap.val();
            const hash = await hashPassword(pwd, salt);
            if (hash === hashSnap.val()) {
                sessionStorage.setItem('teacher_auth', 'true');
                return true;
            } else {
                alert('❌ Неверный пароль.');
                return false;
            }
        }

        const authOk = await initAuth();
        if (!authOk) {
            document.getElementById('app').innerHTML = '<div class="empty-message" style="text-align:center; margin-top:3rem;"><h2>❌ Доступ запрещён</h2></div>';
            throw new Error('Unauthorized');
        }
        
        let theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('themeToggle').textContent = theme==='light'?'🌙':'☀️';
        document.getElementById('themeToggle').onclick = ()=>{
            theme = theme==='light'?'dark':'light';
            localStorage.setItem('theme', theme);
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('themeToggle').textContent = theme==='light'?'🌙':'☀️';
        };

        document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{
            document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
            b.classList.add('active');
            renderTab(b.dataset.tab);
        }));

        function escapeHtml(text) { if(!text) return ''; const map={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}; return String(text).replace(/[&<>"']/g, m=>map[m]); }
        function safeKey(str) { if(!str) return 'empty'; return 'q_' + String(str).replace(/[^a-zA-Z0-9а-яА-ЯёЁ_]/g, '_').slice(0,200); }

        async function renderTab(tab) {
            document.getElementById('app').innerHTML='';
            if(tab==='students') await renderStudentsTab();
            else if(tab==='topics') await renderTopicsTab();
            else if(tab==='dictionary') await renderDictionaryTab();
            else if(tab==='settings') renderSettingsTab();
            else if(tab==='questions') await renderQuestionsTab();
            else if(tab==='auditLog') await renderAuditLogTab();
            else if(tab==='dateStats') await renderDateStatsTab();
        }

        // ===================== УЧЕНИКИ =====================
        async function renderStudentsTab() {
            const app = document.getElementById('app');
            app.innerHTML = '<div class="section-title">👥 Ученики и коды доступа</div>';
            const codesDiv = document.createElement('div'); codesDiv.id='accessCodesSection'; app.appendChild(codesDiv);
            const listDiv = document.createElement('div'); listDiv.id='studentsListSection'; app.appendChild(listDiv);
            await renderAccessCodes(codesDiv);
            await renderStudentsList(listDiv);
        }
        
        // Вкладка "Вопросы" — список вопросов от всех учеников (в реальном времени)
        async function renderQuestionsTab() {
            const app = document.getElementById('app');
            app.innerHTML = '<div class="section-title">❓ Вопросы учеников</div><div id="questionsList"></div>';
            const listDiv = document.getElementById('questionsList');
            const studentsRef = ref(db, `teachers/${teacherId}/students`);
            onValue(studentsRef, snap => {
                const studentsObj = snap.val() || {};
                const items = [];
                Object.entries(studentsObj).forEach(([uid, s]) => {
                    const qs = s.questions || [];
                    qs.forEach(q => {
                        if (q.type === 'view') return;
                        items.push(Object.assign({}, q, { uid, studentName: s.name || '—' }));
                    });
                });
    
                // сортируем по времени (последние сверху)
                items.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
    
                if (!items.length) {
                    listDiv.innerHTML = '<div class="empty-message">Нет новых вопросов.</div>';
                    return;
                }
    
                 listDiv.innerHTML = items.map(it => {
                     const date = new Date(it.timestamp).toLocaleString('ru-RU');
                     const tq = JSON.stringify(it.taskQuestion || {}).replace(/'/g, "&#039;");
                     const hasAnswer = it.answered === true;
                     return `<div class="topic-card" data-uid="${it.uid}" data-ts="${it.timestamp}">
                         <p style="margin-bottom:0.3rem;"><strong>${escapeHtml(it.questionText)}</strong></p>
                         <p style="font-size:0.85rem;color:var(--text-secondary);">От: <strong>${escapeHtml(it.studentName)}</strong> • ${date}</p>
                         <div style="margin-top:0.6rem;">
                              <button class="btn small view-task" data-uid="${it.uid}" data-topicid="${it.topicId}" data-taskquestion='${tq}'>Просмотреть задание</button>
                              <button class="btn small ${hasAnswer ? 'outline' : 'outline'}" data-uid="${it.uid}" data-ts="${it.timestamp}">${hasAnswer ? 'Просмотреть ответ' : 'Ответить'}</button>
                              <button class="btn small danger delete-q" data-uid="${it.uid}" data-ts="${it.timestamp}">Удалить</button>
                         </div>
                     </div>`;
                 }).join('');
    
                // Навешиваем обработчики
                listDiv.querySelectorAll('.view-task').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const topicId = btn.dataset.topicid;
                        let taskQ;
                        try { taskQ = JSON.parse(btn.dataset.taskquestion); } catch { taskQ = btn.dataset.taskquestion; }
                        showTaskForTeacher(topicId, taskQ, btn.dataset.uid);
                    });
                });
    
    
                listDiv.querySelectorAll('.delete-q').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        if (!confirm('Удалить этот вопрос?')) return;
                        const uid = btn.dataset.uid;
                        const ts = Number(btn.dataset.ts);
                        const studentRef = ref(db, `teachers/${teacherId}/students/${uid}`);
                        const snap2 = await get(studentRef);
                        const student = snap2.val() || {};
                        const qs = student.questions || [];
                        const filtered = qs.filter(q => q.timestamp !== ts);
                        await update(studentRef, { questions: filtered });
                    });
                });

        listDiv.querySelectorAll('.reply-btn, .btn.small.outline').forEach(btn => {
            btn.addEventListener('click', () => {
                const uid = btn.dataset.uid;
                const ts = Number(btn.dataset.ts);
                showReplyModal(uid, ts);
            });
        });
            });
        }

        async function showReplyModal(uid, timestamp) {
            const modal = document.createElement('div');
            modal.className = 'modal-backdrop';

            // Получаем существующий ответ, если он есть
            const studentRef = ref(db, `teachers/${teacherId}/students/${uid}`);
            const snap = await get(studentRef);
            const student = snap.val() || {};
            const questions = student.questions || [];
            const question = questions.find(q => q.timestamp === timestamp);
            const existingReply = question?.teacherReply || '';
            const repliedAt = question?.repliedAt || null;

            let modalTitle = 'Ответить ученику';
            let buttonText = 'Отправить';
            let textareaDisabled = false;

            if (existingReply) {
                modalTitle = 'Просмотр ответа';
                buttonText = 'Редактировать';
                textareaDisabled = true;
            }

            modal.innerHTML = `
                <div class="modal-content">
                    <button class="modal-close">&times;</button>
                    <h3>${modalTitle}</h3>
                    ${repliedAt ? `<p style="color: var(--text-secondary); margin-bottom: 1rem; font-size: 0.9rem;">
                        Отвечено: ${new Date(repliedAt).toLocaleString('ru-RU')}
                    </p>` : ''}
                    <div style="margin: 1.5rem 0;">
                        <label style="display: block; margin-bottom: 1rem; font-weight: 600;">Ваш ответ</label>
                        <textarea id="replyText" style="width:100%; height:150px; padding:0.8rem; border:1px solid var(--border); border-radius:8px; font-family:inherit;" ${textareaDisabled ? 'readonly' : ''}>${escapeHtml(existingReply)}</textarea>
                    </div>
                    <div style="display:flex; gap:0.5rem; margin-top:1.5rem;">
                        <button class="btn" id="sendReply">${buttonText}</button>
                        <button class="btn outline" id="cancelReply">Отмена</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const textArea = modal.querySelector('#replyText');
            const sendBtn = modal.querySelector('#sendReply');
            const cancelBtn = modal.querySelector('#cancelReply');

            // Функция для отправки/обновления ответа
            async function sendOrUpdateReply() {
                const replyText = textArea.value.trim();
                if (!replyText) {
                    alert('Введите текст ответа');
                    return;
                }

                try {
                    const updatedQuestions = questions.map(q => {
                        if (q.timestamp === timestamp) {
                            return Object.assign({}, q, {
                                teacherReply: replyText,
                                repliedAt: Date.now(),
                                answered: true,
                                answeredAt: Date.now()
                            });
                        }
                        return q;
                    });

                    await update(studentRef, { questions: updatedQuestions });
                    modal.remove();
                    alert(existingReply ? 'Ответ обновлён!' : 'Ответ отправлен ученику!');
                } catch (error) {
                    console.error('Ошибка при отправке ответа:', error);
                    alert('Ошибка при отправке ответа: ' + error.message);
                }
            }

            // Функция для включения редактирования
            function enableEditing() {
                textArea.removeAttribute('readonly');
                sendBtn.textContent = 'Обновить ответ';
                sendBtn.onclick = sendOrUpdateReply;
                textArea.focus();
            }

            if (existingReply) {
                // Если ответ уже существует, делаем кнопку "Редактировать"
                sendBtn.onclick = enableEditing;
            } else {
                // Если ответа нет, делаем кнопку "Отправить"
                sendBtn.onclick = sendOrUpdateReply;
            }

            cancelBtn.onclick = () => {
                const text = textArea.value.trim();
                const originalText = existingReply || '';
                if (text !== originalText && !confirm('Вы действительно хотите выйти? Введённый текст будет потерян.')) return;
                modal.remove();
            };

            modal.querySelector('.modal-close').onclick = () => {
                const text = textArea.value.trim();
                const originalText = existingReply || '';
                if (text !== originalText && !confirm('Вы действительно хотите выйти? Введённый текст будет потерян.')) return;
                modal.remove();
            };

            modal.addEventListener('click', e => {
                if (e.target === modal) {
                    const text = textArea.value.trim();
                    const originalText = existingReply || '';
                    if (text !== originalText && !confirm('Вы действительно хотите выйти? Введённый текст будет потерян.')) return;
                    modal.remove();
                }
            });
        }

        async function renderAccessCodes(container) {
            // Новая система: коды доступа не используются
            // Ученики регистрируются сами через логин/пароль
            container.innerHTML = `
                <div style="background: var(--bg); border-radius: 12px; padding: 1rem; margin: 1rem 0;">
                    <p style="margin-bottom: 0.5rem;">🔐 <strong>Новая система входа для учеников</strong></p>
                    <p style="font-size: 0.9rem; color: var(--text-secondary);">
                        Ученики сами создают логин (псевдоним) и пароль на странице ученика.<br>
                        Учитель может назначать темы и отслеживать прогресс.
                    </p>
                </div>
            `;
        }

        async function renderStudentsList(container) {
            const studentsRef = ref(db, `teachers/${teacherId}/students`);
            onValue(studentsRef, async snap => {
                const studentsObj = snap.val() || {};
                const students = Object.entries(studentsObj).map(([id,data])=>({id,...data}));
                let html = '<table><tr><th>Имя</th><th>Код</th><th>Темы</th><th>Действия</th></tr>';
                students.forEach(s => {
                    const passed = s.topicProgress ? Object.keys(s.topicProgress).length : 0;
                    const isGhost = s.isGhost === true;
                    const nameDisplay = isGhost ? `👻 ${escapeHtml(s.name)}` : escapeHtml(s.name);
                    const rowClass = s.deleted ? 'deleted-row' : (isGhost ? 'ghost-row' : '');
                    html += `<tr class="${rowClass}"><td>${nameDisplay}</td><td>${escapeHtml(s.accessCodeUsed||'—')}</td><td>${passed}</td><td><div class="dropdown"><button class="menu-btn">⋮</button><div class="dropdown-content"><button class="view-details" data-uid="${s.id}">📊 Успеваемость</button><button class="view-final-tests" data-uid="${s.id}">📝 Итоговые тесты</button><button class="manage-topics" data-uid="${s.id}">📚 Назначить темы</button>${!s.deleted?`<button class="delete-student" data-uid="${s.id}">🗑 Удалить</button>`:`<button class="restore-student" data-uid="${s.id}">🔄 Восстановить</button>`}${!s.deleted && !isGhost ? `<button class="create-ghost" data-uid="${s.id}">👻 Создать призрака</button>` : ''}</div></div></td></tr>`;
                });
                html += '</table>';
                container.innerHTML = html;
                container.querySelectorAll('.menu-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const dropdown = btn.nextElementSibling;
                        if (!dropdown) return;
                        document.querySelectorAll('.dropdown-content').forEach(d => { if (d !== dropdown) d.style.display = 'none'; });
                        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
                    });
                });
                document.addEventListener('click', () => document.querySelectorAll('.dropdown-content').forEach(d => d.style.display = 'none'));
                container.querySelectorAll('.view-details').forEach(b => b.onclick = () => showStudentProgress(b.dataset.uid));
                container.querySelectorAll('.view-final-tests').forEach(b => b.onclick = () => showFinalTests(b.dataset.uid));
                container.querySelectorAll('.manage-topics').forEach(b => b.onclick = () => showTopicAssignmentModal(b.dataset.uid));
                container.querySelectorAll('.delete-student').forEach(b => b.onclick = async () => { if(confirm('Удалить ученика?')) await update(ref(db,`teachers/${teacherId}/students/${b.dataset.uid}`),{deleted:true}) });
                container.querySelectorAll('.restore-student').forEach(b => b.onclick = async () => await update(ref(db,`teachers/${teacherId}/students/${b.dataset.uid}`),{deleted:false}) );
                container.querySelectorAll('.create-ghost').forEach(b => b.onclick = () => showCreateGhostDialog(b.dataset.uid));
            });
        }

        // ===================== СОЗДАНИЕ ПРИЗРАКА =====================
        async function showCreateGhostDialog(originalUid) {
            const studentSnap = await get(ref(db, `teachers/${teacherId}/students/${originalUid}`));
            if (!studentSnap.exists()) return alert('Ученик не найден');
            const originalStudent = studentSnap.val();
            
            const backdrop = document.createElement('div');
            backdrop.className = 'modal-backdrop';
            backdrop.innerHTML = `
                <div class="modal-content" style="max-width:450px;">
                    <button class="modal-close">&times;</button>
                    <h3>👻 Создание призрака</h3>
                    <p style="margin:1rem 0; color:var(--text-secondary);">
                        Будет создана копия ученика <strong>${escapeHtml(originalStudent.name)}</strong> 
                        с теми же темами, прогрессом и историей ответов.
                    </p>
                    <div style="margin:1rem 0;">
                        <label style="display:block; margin-bottom:0.3rem; font-weight:600;">Логин для призрака:</label>
                        <input type="text" id="ghostLogin" value="${escapeHtml(originalStudent.name)}_ghost" style="width:100%;">
                    </div>
                    <div style="margin:1rem 0;">
                        <label style="display:block; margin-bottom:0.3rem; font-weight:600;">Пароль для призрака:</label>
                        <input type="password" id="ghostPassword" value="" placeholder="Придумайте пароль" style="width:100%;">
                    </div>
                    <div style="margin:1rem 0;">
                        <label style="display:block; margin-bottom:0.3rem; font-weight:600;">Подтвердите пароль:</label>
                        <input type="password" id="ghostPasswordConfirm" value="" placeholder="Подтвердите пароль" style="width:100%;">
                    </div>
                    <div id="ghostError" style="color:#ef4444; margin-bottom:0.5rem;"></div>
                    <div style="display:flex; gap:0.5rem; margin-top:1.5rem;">
                        <button class="btn" id="createGhostBtn">👻 Создать призрака</button>
                        <button class="btn outline" id="cancelGhostBtn">Отмена</button>
                    </div>
                </div>
            `;
            document.body.appendChild(backdrop);
            
            const errorDiv = backdrop.querySelector('#ghostError');
            
            backdrop.querySelector('.modal-close').onclick = () => backdrop.remove();
            backdrop.querySelector('#cancelGhostBtn').onclick = () => backdrop.remove();
            backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.remove(); });
            
            backdrop.querySelector('#createGhostBtn').onclick = async () => {
                const login = backdrop.querySelector('#ghostLogin').value.trim();
                const password = backdrop.querySelector('#ghostPassword').value;
                const passwordConfirm = backdrop.querySelector('#ghostPasswordConfirm').value;
                
                if (!login) { errorDiv.textContent = 'Введите логин'; return; }
                if (!password) { errorDiv.textContent = 'Введите пароль'; return; }
                if (password !== passwordConfirm) { errorDiv.textContent = 'Пароли не совпадают'; return; }
                if (password.length < 6) { errorDiv.textContent = 'Пароль должен быть не менее 6 символов'; return; }
                
                // Проверяем, не занят ли логин
                const credSnap = await get(ref(db, 'student_credentials'));
                if (credSnap.exists()) {
                    for (const [uid, data] of Object.entries(credSnap.val())) {
                        if (data.nick === login) {
                            errorDiv.textContent = 'Этот логин уже занят';
                            return;
                        }
                    }
                }
                
                try {
                    // Генерируем UID для призрака
                    const newUid = 'ghost_' + Math.random().toString(36).substr(2, 12) + Date.now().toString(36).substr(2, 6);
                    
                    // Копируем данные ученика с флагом isGhost
                    const ghostData = JSON.parse(JSON.stringify(originalStudent));
                    ghostData.name = login;
                    ghostData.isGhost = true;
                    ghostData.originalStudentId = originalUid;
                    ghostData.createdAt = Date.now();
                    delete ghostData.deleted;
                    
                    // Сохраняем призрака как нового ученика
                    await set(ref(db, `teachers/${teacherId}/students/${newUid}`), ghostData);
                    
                    // Сохраняем credentials для входа (с хэшем пароля)
                    const encoder = new TextEncoder();
                    const pwdData = encoder.encode(password + login);
                    const pwdHash = await crypto.subtle.digest('SHA-256', pwdData);
                    const pwdHashHex = Array.from(new Uint8Array(pwdHash)).map(b => b.toString(16).padStart(2,'0')).join('');
                    
                    await set(ref(db, `student_credentials/${newUid}`), {
                        nick: login,
                        passwordHash: pwdHashHex,
                        createdAt: Date.now(),
                        teacherId: teacherId,
                        isGhost: true
                    });
                    
                    backdrop.remove();
                    alert(`👻 Призрак "${login}" успешно создан!`);
                } catch (error) {
                    console.error(error);
                    errorDiv.textContent = 'Ошибка: ' + error.message;
                }
            };
        }

        // ===================== УСПЕВАЕМОСТЬ =====================
        async function showStudentProgress(uid) {
            try {
                const studentSnap = await get(ref(db,`teachers/${teacherId}/students/${uid}`));
                if (!studentSnap.exists()) return alert('Ученик не найден');
                const student = studentSnap.val();

                const topics = topicsSnap.val() ? Object.values(topicsSnap.val()) : [];
                const progress = student.topicProgress || {};

                const backdrop = document.createElement('div'); backdrop.className='modal-backdrop';
                let showErrors = false;

                function renderContent() {
                    let html = `<div class="modal-content"><button class="modal-close">&times;</button>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <h3>📊 ${escapeHtml(student.name)} – успеваемость</h3>
                            <button class="btn small danger" id="toggleErrorsBtn">${showErrors?'Показать прогресс':'Показать ошибки'}</button>
                        </div>`;
                    topics.forEach(t => {
                        const tp = progress[t.id];
                        const level = tp ? tp.level||1 : 0;
                        html += `<div class="topic-header" data-topicid="${t.id}"><strong>${escapeHtml(t.title)}</strong> <span>Уровень ${level} ▾</span></div><div id="topic-questions-${t.id}" style="display:none;">`;
                        if (!t.test || t.test.length === 0) {
                            html += '<p class="empty-message">Нет вопросов</p>';
                        } else {
                            t.test.forEach(q => {
                                const key = safeKey(q.question);
                                const qp = tp?.questions?.[key];
                                const cnt = showErrors ? (qp?.history?.filter(h=>!h.correct).length || 0) : (qp?.correctCount || 0);
                                const maxNeeded = (!showErrors && qp && qp.firstCorrect) ? 3 : 4;
                                const max = showErrors ? 10 : maxNeeded;
                                let pct, fillClass;
                                if (!showErrors && cnt < 0) {
                                    // Отрицательный correctCount — жёлтая шкала, длина от magnitude
                                    const absCnt = Math.abs(cnt);
                                    pct = Math.min(100, (absCnt/max)*100);
                                    fillClass = 'deficit-progress-fill';
                                } else {
                                    pct = Math.min(100, (cnt/max)*100);
                                    fillClass = showErrors ? 'error-progress-fill' : 'progress-fill';
                                }
                                html += `<div class="question-progress-item">
                                    <span style="flex:1; font-size:0.85rem;" class="question-link" data-topicid="${t.id}" data-qtext="${escapeHtml(q.question)}">${escapeHtml(q.question)}</span>
                                    <div class="progress-bar" style="width:100px;"><div class="progress-fill ${fillClass}" style="width:${pct}%"></div></div>
                                    <span style="font-size:0.8rem;">${cnt}/${max}${!showErrors && qp && qp.modifier > 0 ? `<span style="font-size:0.7rem; color:#d4a017; margin-left:0.3rem;"> (вес: +${qp.modifier}%)</span>` : ''}${!showErrors && qp && qp.firstCorrect ? `<span style="font-size:0.7rem; color:#10b981; margin-left:0.3rem;"> (ускоренный)</span>` : ''}</span>
                                </div>`;
                            });
                        }
                        html += `</div>`;
                    });
                    html += `</div>`;
                    backdrop.innerHTML = html;
                    backdrop.querySelector('.modal-close').onclick = ()=>backdrop.remove();
                    backdrop.querySelector('#toggleErrorsBtn').onclick = ()=>{ showErrors=!showErrors; renderContent(); };
                    backdrop.querySelectorAll('.topic-header').forEach(header => {
                        header.addEventListener('click', () => {
                            const id = header.dataset.topicid;
                            const div = document.getElementById(`topic-questions-${id}`);
                            if (div) div.style.display = div.style.display === 'none' ? 'block' : 'none';
                        });
                    });
                    backdrop.querySelectorAll('.question-link').forEach(link => {
                        link.addEventListener('click', async () => {
                            try {
                                const topicId = link.dataset.topicid;
                                const qtext = link.dataset.qtext;
                                const tSnap = await get(ref(db,`teachers/${teacherId}/topics/${topicId}`));
                                if (!tSnap.exists()) return alert('Тема не найдена');
                                const topic = tSnap.val();
                                const question = (topic.test||[]).find(q=>q.question===qtext);
                                if (!question) return alert('Вопрос не найден');
                                const freshStudentSnap = await get(ref(db,`teachers/${teacherId}/students/${uid}`));
                                const freshProgress = freshStudentSnap.val()?.topicProgress?.[topicId];
                                const key = safeKey(question.question);
                                const hist = freshProgress?.questions?.[key]?.history || [];
                                
                                // Загружаем levelUp timestamps из auditLog для этого ученика+темы
                                const auditSnap = await get(ref(db, `teachers/${teacherId}/auditLog`));
                                const auditLog = auditSnap.val() || {};
                                const levelUpTimestamps = [];
                                for (const entry of Object.values(auditLog)) {
                                    if (entry.type === 'levelUp' && entry.studentId === uid && entry.topicId === topicId) {
                                        levelUpTimestamps.push(entry.timestamp);
                                    }
                                }
                                levelUpTimestamps.sort((a, b) => a - b);
                                
                                showQuestionHistoryModal(question, hist, levelUpTimestamps);
                            } catch (e) {
                                alert('Ошибка при загрузке истории: ' + e.message);
                            }
                        });
                    });
                }
                renderContent();
                document.body.appendChild(backdrop);
                backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.remove(); });
            } catch (error) {
                alert('Ошибка загрузки статистики: ' + error.message);
            }
        }
