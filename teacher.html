        // ===================== ИСТОРИЯ ОТВЕТОВ =====================
        function showQuestionHistoryModal(q, history, levelUpTimestamps) {
            const overlay = document.createElement('div'); overlay.className='modal-backdrop';
            const imgHtml = q.image ? `<div class="resizable-image-container" style="margin-bottom:0.8rem;${q.imageWidth ? `width:${q.imageWidth}px;height:${q.imageHeight}px;` : ''}"><img src="${escapeHtml(q.image)}" class="resizable-image" alt="Изображение к вопросу"><div class="resize-handle"></div></div>` : '';
            
            // Симулируем пересчёт correctCount как при очистке дубликатов
            let simCorrectCount = 0;
            let simModifier = 0;
            let simFastTrack = false;
            let simFirst = false;
            let simTotalDeficit = 0;
            let simLogLines = [];
            let nextLevelUpIdx = 0;
            const sorted = [...(history || [])].sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            
            simLogLines.push(`🧮 <strong>Симуляция пересчёта correctCount</strong>`);
            simLogLines.push(`   Уровней повышений (levelUp): ${(levelUpTimestamps||[]).length}`);
            simLogLines.push(`   Всего записей в истории: ${sorted.length}`);
            simLogLines.push(`   ─────────────────────────────`);
            
            for (const hRec of sorted) {
                // Проверяем levelUp
                while (nextLevelUpIdx < (levelUpTimestamps||[]).length && 
                       (hRec.timestamp || 0) >= levelUpTimestamps[nextLevelUpIdx]) {
                    const maxForLevel = simFastTrack ? 3 : 4;
                    const deficit = Math.max(0, maxForLevel - simCorrectCount);
                    simTotalDeficit += deficit;
                    const luDate = new Date(levelUpTimestamps[nextLevelUpIdx]).toLocaleString('ru-RU');
                    simLogLines.push(`   🔼 <strong>LEVEL UP</strong> в ${luDate}`);
                    simLogLines.push(`      Было баллов: ${simCorrectCount}/${maxForLevel}`);
                    simLogLines.push(`      Дефицит: ${deficit} (не хватило до ${maxForLevel})`);
                    // Сначала сбрасываем correctCount в 0 при переходе на новый уровень
                    simLogLines.push(`      Сброс correctCount → 0`);
                    simCorrectCount = 0;
                    simModifier = 0;
                    simFastTrack = false;
                    simFirst = false;
                    // Потом вычитаем дефицит с прошлого уровня из счёта на новом уровне
                    if (deficit > 0) {
                        simCorrectCount = simCorrectCount - deficit;
                        simLogLines.push(`      Вычитаем дефицит прошлого уровня: → ${simCorrectCount} (может уйти в минус — это legacy-долг)`);
                    }
                    nextLevelUpIdx++;
                }
                
                if (!simFirst) {
                    simFirst = true;
                    if (hRec.correct) simFastTrack = true;
                }
                
                const date = new Date(hRec.timestamp).toLocaleString('ru-RU');
                const oldCount = simCorrectCount;
                if (hRec.correct) {
                    simCorrectCount++;
                    simModifier = Math.max(0, simModifier - 20);
                } else {
                    simCorrectCount = Math.max(0, simCorrectCount - 1);
                    simModifier = Math.min(60, simModifier + 20);
                    simFastTrack = false;
                }
                simLogLines.push(`   ${hRec.correct ? '✅' : '❌'} ${date}: ${oldCount} → ${simCorrectCount}`);
            }
            
            // Проверяем, не было ли levelUp ПОСЛЕ последней записи в истории
            while (nextLevelUpIdx < (levelUpTimestamps||[]).length) {
                const maxForLevel = simFastTrack ? 3 : 4;
                const deficit = Math.max(0, maxForLevel - simCorrectCount);
                simTotalDeficit += deficit;
                const luDate = new Date(levelUpTimestamps[nextLevelUpIdx]).toLocaleString('ru-RU');
                simLogLines.push(`   🔼 <strong>LEVEL UP (после истории)</strong> в ${luDate}`);
                simLogLines.push(`      Было баллов: ${simCorrectCount}/${maxForLevel}`);
                simLogLines.push(`      Дефицит: ${deficit} (не хватило до ${maxForLevel})`);
                // Сначала сбрасываем correctCount в 0 при переходе на новый уровень
                simLogLines.push(`      Сброс correctCount → 0`);
                simCorrectCount = 0;
                simModifier = 0;
                simFastTrack = false;
                simFirst = false;
                // Потом вычитаем дефицит с прошлого уровня из счёта на новом уровне
                if (deficit > 0) {
                    simCorrectCount = simCorrectCount - deficit;
                    simLogLines.push(`      Вычитаем дефицит прошлого уровня: → ${simCorrectCount} (может уйти в минус — это legacy-долг)`);
                }
                nextLevelUpIdx++;
            }
            
            const simMaxNeeded = simFastTrack ? 3 : 4;
            if (simCorrectCount > simMaxNeeded) {
                simCorrectCount = simMaxNeeded;
            }
            simLogLines.push(`   ─────────────────────────────`);
            simLogLines.push(`   🏁 <strong>Итоговый correctCount: ${simCorrectCount}/${simMaxNeeded}</strong>`);
            if (simFastTrack) simLogLines.push(`   ⚡ Fast track (первый ответ был правильным)`);
            
            let html = `<div class="modal-content"><button class="modal-close">&times;</button>
                <h3>📋 Задание</h3>
                ${imgHtml}
                <p><strong>${escapeHtml(q.question)}</strong></p>
                <p>Тип: ${q.type==='card'?'Карточка':q.type==='open'?'Открытый ответ':'Выбор варианта'}</p>
                ${q.explanation?`<p><em>Объяснение: ${escapeHtml(q.explanation)}</em></p>`:''}
                
                <details style="margin:1rem 0; padding:0.8rem; background:var(--bg); border-radius:8px; border:1px solid var(--border);" open>
                    <summary style="cursor:pointer; font-weight:600; font-size:0.95rem;">🧮 Лог пересчёта correctCount</summary>
                    <div style="margin-top:0.8rem; font-family:monospace; font-size:0.85rem; line-height:1.6; white-space:pre-wrap;">${simLogLines.join('\n')}</div>
                </details>
                
                <h4 style="margin-top:1rem;">История ответов</h4>`;
            if (!history || !history.length) {
                html += '<p>Нет записей</p>';
            } else {
                history.slice().reverse().forEach(rec => {
                    const date = new Date(rec.timestamp).toLocaleString('ru-RU');
                    html += `<div class="history-block">
                        <p><strong>📅 ${date}</strong> — ${rec.correct ? '✅ Верно' : '❌ Ошибка'}</p>`;
                    if (q.type === 'open' && rec.userAnswer !== undefined) {
                        const user = rec.userAnswer || '';
                        const correct = rec.correctAnswer || '';
                        if (rec.correct) {
                            if (rec.punctuationWarning) {
                                html += `<div class="history-answer">Ответ ученика: <span class="diff-correct">${escapeHtml(user)}</span></div>`;
                                html += `<p style="color:#d4a017;">🔍 Ученик забыл знак препинания в конце предложения</p>`;
                            } else {
                                html += `<div class="history-answer">Ответ ученика: <span class="diff-correct">${escapeHtml(user)}</span></div>`;
                            }
                        } else {
                            const maxLen = Math.max(user.length, correct.length);
                            let userHtml = '', correctHtml = '';
                            for (let i = 0; i < maxLen; i++) {
                                const uChar = user[i] || '';
                                const cChar = correct[i] || '';
                                if (uChar.toLowerCase() === cChar.toLowerCase() && uChar !== '' && cChar !== '') {
                                    userHtml += escapeHtml(uChar);
                                    correctHtml += escapeHtml(cChar);
                                } else {
                                    userHtml += `<span class="diff-wrong">${escapeHtml(uChar || ' ')}</span>`;
                                    correctHtml += `<span class="diff-correct">${escapeHtml(cChar || ' ')}</span>`;
                                }
                            }
                            html += `<div class="history-answer">Ответ ученика: ${userHtml || '—'}</div>`;
                            html += `<div class="history-answer">Правильный: ${correctHtml || '—'}</div>`;
                        }
                    } else if (q.type === 'choice' && rec.options) {
                        const chosen = rec.chosenIdx !== undefined && rec.chosenIdx >= 0 ? rec.options[rec.chosenIdx] : '—';
                        const correctOpt = rec.options[rec.correctIdx] || '';
                        if (rec.correct) {
                            html += `<div class="history-answer">Выбран: <span class="diff-correct">${escapeHtml(chosen)}</span></div>`;
                        } else {
                            html += `<div class="history-answer">Выбран: <span class="diff-wrong">${escapeHtml(chosen)}</span></div>`;
                            html += `<div class="history-answer">Правильный: <span class="diff-correct">${escapeHtml(correctOpt)}</span></div>`;
                        }
                    } else if (q.type === 'card') {
                        html += `<p>Карточка ${rec.correct ? 'просмотрена' : 'не просмотрена'}</p>`;
                    }
                    html += `</div>`;
                });
            }
            html += '</div>';
            overlay.innerHTML = html;
            document.body.appendChild(overlay);
            overlay.querySelector('.modal-close').onclick = ()=>overlay.remove();
            overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
        }

        // ===================== НАЗНАЧЕНИЕ ТЕМ =====================
        async function showTopicAssignmentModal(uid) {
            const topicsSnap = await get(ref(db,`teachers/${teacherId}/topics`));
            const topics = topicsSnap.val() ? Object.values(topicsSnap.val()) : [];
            const studentSnap = await get(ref(db,`teachers/${teacherId}/students/${uid}`));
            const student = studentSnap.exists() ? studentSnap.val() : {};
            const backdrop = document.createElement('div'); backdrop.className='modal-backdrop';
            backdrop.innerHTML = `<div class="modal-content"><button class="modal-close">&times;</button><h3>📚 Назначение тем для ${escapeHtml(student.name||'ученика')}</h3><div>${topics.map(t=>`<label><input type="checkbox" data-topicid="${t.id}" ${t.assignedTo?.includes(uid)?'checked':''}> ${escapeHtml(t.title)}</label><br>`).join('')}</div><button class="btn" id="saveAssign">Сохранить</button></div>`;
            document.body.appendChild(backdrop);
            backdrop.querySelector('.modal-close').onclick = ()=>backdrop.remove();
            backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.remove(); });
            backdrop.querySelector('#saveAssign').onclick = async () => {
                const cbs = backdrop.querySelectorAll('input[type=checkbox]');
                for (const cb of cbs) {
                    const refT = ref(db,`teachers/${teacherId}/topics/${cb.dataset.topicid}`);
                    const snap = await get(refT);
                    if (!snap.exists()) continue;
                    let assigned = snap.val().assignedTo || [];
                    if (cb.checked) { if (!assigned.includes(uid)) assigned.push(uid); }
                    else assigned = assigned.filter(id=>id!==uid);
                    await update(refT, { assignedTo: assigned.length>0?assigned:null });
                }
                backdrop.remove();
            };
        }

        // ===================== РЕДАКТОР ТЕМ =====================
        async function renderTopicsTab() {
            const app = document.getElementById('app');
            app.innerHTML = '<div class="section-title">📚 Темы</div><div style="display:flex; gap:0.5rem; margin-bottom:1rem;"><button class="btn" id="addTopicBtn">➕ Создать тему</button><button class="btn outline" id="importTopicsBtn">📥 Импортировать темы (JSON)</button></div><input type="file" id="importTopicsFile" accept=".json" style="display:none;"><div id="topicsList" style="margin-top:1.5rem;"></div>';
            
            document.getElementById('addTopicBtn').onclick = () => openTopicEditor(null);
            document.getElementById('importTopicsBtn').onclick = () => {
                document.getElementById('importTopicsFile').click();
            };
            document.getElementById('importTopicsFile').onchange = async (event) => {
                const file = event.target.files[0];
                if (!file) return;
                try {
                    const text = await file.text();
                    const importData = JSON.parse(text);
                    const topics = Array.isArray(importData) ? importData : [importData];
                    let imported = 0, errors = 0;
                    for (const topic of topics) {
                        try {
                            if (!topic.title) { errors++; continue; }
                            const newTopic = {
                                title: topic.title,
                                theory: topic.theory || '',
                                test: [],
                                questionsPerTest: topic.questionsPerTest || 10,
                                randomOrder: topic.randomOrder || false,
                                timeLimit: topic.timeLimit || null,
                                assignedTo: null
                            };
                            if (topic.test && Array.isArray(topic.test)) {
                                for (const q of topic.test) {
                                    const question = {
                                        type: q.type || 'open',
                                        question: q.question || '',
                                        explanation: q.explanation || '',
                                        timeLimit: q.timeLimit || null
                                    };
                                    if (question.type === 'open') question.correctAnswer = q.correctAnswer || '';
                                    else if (question.type === 'choice') {
                                        question.options = q.options || ['', '', '', ''];
                                        question.correct = q.correct || 0;
                                    } else if (question.type === 'card') question.answer = q.answer || '';
                                    newTopic.test.push(question);
                                }
                            }
                            const newRef = push(ref(db, `teachers/${teacherId}/topics`));
                            newTopic.id = newRef.key;
                            await set(newRef, newTopic);
                            imported++;
                        } catch (err) { errors++; }
                    }
                    alert(`✅ Импорт завершён!
Добавлено: ${imported} тем
Ошибок: ${errors}`);
                    location.reload();
                } catch (err) { alert('Ошибка чтения файла: ' + err.message); }
                document.getElementById('importTopicsFile').value = '';
            };
            
            const topicsRef = ref(db,`teachers/${teacherId}/topics`);
            onValue(topicsRef, snap => {
                const topics = snap.val() ? Object.values(snap.val()) : [];
                const list = document.getElementById('topicsList');
                if (!topics.length) { list.innerHTML = '<div class="empty-message">Нет тем</div>'; return; }
                list.innerHTML = topics.map(t=>`<div style="border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1rem;"><h4>${escapeHtml(t.title)}</h4><p>${t.test?t.test.length:0} вопросов</p><div style="margin-top:1rem;"><button class="btn small edit-topic" data-id="${t.id}">✏️ Редактировать</button> <button class="btn small danger delete-topic" data-id="${t.id}">🗑 Удалить</button></div></div>`).join('');
                list.querySelectorAll('.edit-topic').forEach(b=>b.onclick=()=>openTopicEditor(b.dataset.id));
                list.querySelectorAll('.delete-topic').forEach(b=>b.onclick=async ()=>{if(confirm('Удалить тему?')) await remove(ref(db,`teachers/${teacherId}/topics/${b.dataset.id}`))});
            });
        }

        async function openTopicEditor(topicId) {
            let topic = { title:'', theory:'', test:[], questionsPerTest:10, randomOrder:false, assignedTo:null };
            if (topicId) {
                const snap = await get(ref(db,`teachers/${teacherId}/topics/${topicId}`));
                if (snap.exists()) topic = snap.val();
            }
            let hasUnsavedChanges = false, autoSaveInterval, isSaving = false;
            const backdrop = document.createElement('div'); backdrop.className='modal-backdrop';
            backdrop.innerHTML = `
                <div class="modal-content" style="max-width:750px;">
                    <button class="modal-close" id="closeEditorBtn">&times;</button>
                    <h3>${topicId?'Редактировать':'Новая'} тема</h3>
                    <div id="errorContainer"></div>
                    <label>Название: <input type="text" id="topicTitle" value="${escapeHtml(topic.title)}"></label>
                    <label>Теория (HTML): <textarea id="topicTheory" rows="6">${escapeHtml(topic.theory)}</textarea></label>
                    <label>Время на вопрос по умолчанию (сек): <input type="number" id="topicTimeLimit" value="${topic.timeLimit || ''}" placeholder="30" min="0" style="width:150px;"></label>
                    <div style="display:flex; gap:1rem; align-items:center; margin:1rem 0;">
                        <label>Вопросов в тесте: <input type="number" id="questionsPerTest" value="${topic.questionsPerTest||10}" min="1" style="width:100px;"></label>
                        <label><input type="checkbox" id="randomOrder" ${topic.randomOrder?'checked':''}> Случайный порядок</label>
                    </div>
                    <h4>Вопросы теста</h4>
                    <div id="testQuestions"></div>
                    <button class="btn small" id="addQuestionBtn" style="margin-top:0.5rem;">➕ Добавить вопрос</button>
                    <div style="margin-top:1.5rem; display:flex; gap:0.5rem; align-items:center;">
                        <button class="btn" id="saveTopicBtn">Сохранить</button>
                        <button class="btn outline" id="closeEditorBtn2">Закрыть</button>
                    </div>
                </div>`;
            document.body.appendChild(backdrop);
            const saveBtn = backdrop.querySelector('#saveTopicBtn');
            const errorContainer = backdrop.querySelector('#errorContainer');
            function showError(msg) { errorContainer.innerHTML = `<div class="error-box">${msg}</div>`; setTimeout(()=>errorContainer.innerHTML='', 5000); }
            function markChanged() { if (!hasUnsavedChanges) { hasUnsavedChanges = true; saveBtn.textContent = 'Сохранить'; } }
            function markSaved() { hasUnsavedChanges = false; saveBtn.textContent = '✅ Сохранено'; setTimeout(()=>saveBtn.textContent='Сохранить', 2000); }
            function collectTestData() {
                const blocks = backdrop.querySelectorAll('#testQuestions .question-block');
                topic.test = [];
                blocks.forEach(block => {
                    const idx = block.dataset.idx;
                    if (idx === undefined) return; // пропускаем блоки без dataset.idx
                    const qType = block.querySelector('.q-type')?.value || 'open';
                    const qData = { type: qType, question: block.querySelector('.q-text')?.value || '', timeLimit: block.querySelector('.q-time')?.value || null, explanation: block.querySelector('.q-expl')?.value || '', image: block.querySelector('.q-image')?.value || '', explanationImage: block.querySelector('.q-expl-image')?.value || '' };
                    // Сохраняем размеры изображений, если они были изменены через resize
                    const imgContainer = block.querySelector('.q-image-preview .resizable-image-container');
                    if (imgContainer) {
                        qData.imageWidth = imgContainer.offsetWidth;
                        qData.imageHeight = imgContainer.offsetHeight;
                    }
                    const explImgContainer = block.querySelector('.q-expl-image-preview .resizable-image-container');
                    if (explImgContainer) {
                        qData.explanationImageWidth = explImgContainer.offsetWidth;
                        qData.explanationImageHeight = explImgContainer.offsetHeight;
                    }
                    if (qType === 'card') qData.answer = block.querySelector('.q-answer')?.value || '';
                    if (qType === 'open') qData.correctAnswer = block.querySelector('.q-correct')?.value || '';
                    if (qType === 'choice') {
                        const opts = block.querySelectorAll('.opt-text');
                        qData.options = Array.from(opts).map(o=>o.value);
                        const correctRadio = block.querySelector(`input[name="correct_${idx}"]:checked`);
                        qData.correct = correctRadio ? parseInt(correctRadio.value) : 0;
                    }
                    topic.test.push(qData);
                });
            }
            async function saveTopicData() {
                if (isSaving) return false; isSaving = true;
                try {
                    collectTestData();
                    const title = backdrop.querySelector('#topicTitle')?.value?.trim() || '';
                    if (!title) { showError('Введите название темы'); isSaving=false; return false; }
                    const topicData = { title, theory: backdrop.querySelector('#topicTheory')?.value || '', test: topic.test, questionsPerTest: parseInt(backdrop.querySelector('#questionsPerTest')?.value) || 10, randomOrder: backdrop.querySelector('#randomOrder')?.checked || false, timeLimit: parseInt(backdrop.querySelector('#topicTimeLimit')?.value) || null };
                    if (topicId) await update(ref(db,`teachers/${teacherId}/topics/${topicId}`), topicData);
                    else { const newRef = push(ref(db,`teachers/${teacherId}/topics`)); topicData.id = newRef.key; topicData.assignedTo = null; await set(newRef, topicData); topicId = newRef.key; }
                    markSaved(); isSaving = false; return true;
                } catch (error) { console.error(error); showError('Ошибка сохранения: ' + error.message); isSaving = false; return false; }
            }
            function renderTest() {
                const container = backdrop.querySelector('#testQuestions');
                if (!container) return;
                container.innerHTML = (topic.test||[]).map((q,idx)=>{
                    const isCard = q.type==='card', isOpen = q.type==='open';
                    return `<div class="question-block" data-idx="${idx}">
                        <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.8rem;">
                            <select class="q-type"><option value="open" ${isOpen?'selected':''}>Открытый ответ</option><option value="choice" ${q.type==='choice'?'selected':''}>Выбор варианта</option><option value="card" ${isCard?'selected':''}>Карточка</option></select>
                            <label>Время: <input type="number" class="q-time" value="${q.timeLimit||''}" style="width:80px;"></label></div><div class="question-separator"></div>
                        <label class="question-label">Вопрос:</label><input type="text" class="q-text" value="${escapeHtml(q.question)}" placeholder="Вопрос">
                        ${isCard?`<label class="question-label">Ответ:</label><input type="text" class="q-answer" value="${escapeHtml(q.answer||'')}" placeholder="Ответ">`:''}
                        ${isOpen?`<label class="question-label">Правильный ответ:</label><input type="text" class="q-correct" value="${escapeHtml(q.correctAnswer||'')}" placeholder="Правильный ответ">`:''}
                        ${(!isCard&&!isOpen)?`<label class="question-label">Варианты ответа:</label>${(q.options||['','','','']).map((opt,oi)=>`<div class="option-row"><input type="radio" name="correct_${idx}" value="${oi}" ${q.correct===oi?'checked':''}><input type="text" class="opt-text" value="${escapeHtml(opt)}"></div>`).join('')}`:''}
                        <label class="question-label">Объяснение:</label><input type="text" class="q-expl" value="${escapeHtml(q.explanation||'')}" placeholder="Объяснение">
                        <label class="question-label">Изображение к заданию:</label>
                        <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
                            <input type="hidden" class="q-image" value="${escapeHtml(q.image||'')}">
                            <button type="button" class="btn small outline q-image-upload">📁 Загрузить файл</button>
                            ${q.image ? `<span style="font-size:0.85rem; color:var(--text-muted);">✅ файл загружен</span>` : `<span style="font-size:0.85rem; color:var(--text-muted);">файл не выбран</span>`}
                        </div>
                        ${q.image ? `<div class="q-image-preview" style="margin-top:0.5rem; position:relative; display:inline-block;">
                            <div class="resizable-image-container"${q.imageWidth ? ` style="width:${q.imageWidth}px;height:${q.imageHeight}px;"` : ''}>
                                <img src="${escapeHtml(q.image)}" class="resizable-image" alt="Изображение к заданию">
                                <div class="resize-handle"></div>
                            </div>
                            <button type="button" class="q-image-remove" style="position:absolute; top:-8px; right:-8px; width:24px; height:24px; border-radius:50%; background:#b91c1c; color:white; border:none; cursor:pointer; font-size:14px; line-height:24px; text-align:center;">×</button>
                        </div>` : ''}
                        <label class="question-label">Изображение к объяснению:</label>
                        <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
                            <input type="hidden" class="q-expl-image" value="${escapeHtml(q.explanationImage||'')}">
                            <button type="button" class="btn small outline q-expl-image-upload">📁 Загрузить файл</button>
                            ${q.explanationImage ? `<span style="font-size:0.85rem; color:var(--text-muted);">✅ файл загружен</span>` : `<span style="font-size:0.85rem; color:var(--text-muted);">файл не выбран</span>`}
                        </div>
                        ${q.explanationImage ? `<div class="q-expl-image-preview" style="margin-top:0.5rem; position:relative; display:inline-block;">
                            <div class="resizable-image-container"${q.explanationImageWidth ? ` style="width:${q.explanationImageWidth}px;height:${q.explanationImageHeight}px;"` : ''}>
                                <img src="${escapeHtml(q.explanationImage)}" class="resizable-image" alt="Изображение к объяснению">
                                <div class="resize-handle"></div>
                            </div>
                            <button type="button" class="q-expl-image-remove" style="position:absolute; top:-8px; right:-8px; width:24px; height:24px; border-radius:50%; background:#b91c1c; color:white; border:none; cursor:pointer; font-size:14px; line-height:24px; text-align:center;">×</button>
                        </div>` : ''}
                        <div class="question-separator"></div><div class="question-actions"><button class="btn small danger remove-question">🗑 Удалить</button></div></div>`;
                }).join('');
                container.querySelectorAll('.remove-question').forEach(b=>b.onclick=()=>{ collectTestData(); topic.test.splice(parseInt(b.closest('.question-block').dataset.idx),1); renderTest(); markChanged(); });
                container.querySelectorAll('input, select, textarea').forEach(i=>{ i.addEventListener('input',markChanged); i.addEventListener('change',markChanged); });
                // Функция загрузки изображения через FileReader
                function setupImageUpload(btnSelector, inputSelector) {
                    console.log('setupImageUpload called for', btnSelector, 'found:', container.querySelectorAll(btnSelector).length);
                    container.querySelectorAll(btnSelector).forEach(btn => {
                        btn.addEventListener('click', () => {
                            const input = document.createElement('input');
                            input.type = 'file';
                            input.accept = 'image/*';
                            input.onchange = (e) => {
                                const file = e.target.files[0];
                                if (!file) {
                                    showError('Файл не выбран');
                                    return;
                                }
                                // Проверка размера (макс 5MB)
                                if (file.size > 5 * 1024 * 1024) {
                                    showError('Файл слишком большой. Максимальный размер — 5 МБ.');
                                    return;
                                }
                                const reader = new FileReader();
                                reader.onload = (ev) => {
                                    try {
                                        console.log('reader.onload START, result length:', ev.target.result ? ev.target.result.length : 0);
                                        const block = btn.closest('.question-block');
                                        console.log('block found:', !!block);
                                        const textInput = block.querySelector(inputSelector);
                                        console.log('textInput found:', !!textInput, 'selector:', inputSelector);
                                        if (textInput) {
                                            textInput.value = ev.target.result;
                                            markChanged();
                                            // Определяем селектор превью
                                            const previewSelector = inputSelector.replace('-image', '-image-preview');
                                            console.log('Looking for preview with selector:', previewSelector);
                                            const previewContainer = block.querySelector(previewSelector);
                                            console.log('previewContainer found:', !!previewContainer);
                                            if (previewContainer) {
                                                previewContainer.innerHTML = `<div class="resizable-image-container">
                                                    <img src="${ev.target.result}" class="resizable-image" alt="Изображение">
                                                    <div class="resize-handle"></div>
                                                </div>
                                                <button type="button" class="${inputSelector.replace('.', '').replace('-image', '-image-remove')}" style="position:absolute; top:-8px; right:-8px; width:24px; height:24px; border-radius:50%; background:#b91c1c; color:white; border:none; cursor:pointer; font-size:14px; line-height:24px; text-align:center;">×</button>`;
                                                // Обновляем текст статуса
                                                const statusSpan = block.querySelector(inputSelector === '.q-image' ? '.q-image-upload' : '.q-expl-image-upload');
                                                console.log('statusSpan found:', !!statusSpan);
                                                if (statusSpan) {
                                                    const parent = statusSpan.parentElement;
                                                    const oldStatus = parent.querySelector('span');
                                                    console.log('oldStatus span found:', !!oldStatus);
                                                    if (oldStatus) oldStatus.textContent = '✅ файл загружен';
                                                }
                                                console.log('Preview updated successfully');
                                            } else {
                                                console.log('No preview container, creating one');
                                                // Создаём контейнер превью прямо в DOM
                                                const previewDiv = document.createElement('div');
                                                previewDiv.className = previewSelector.replace('.', '');
                                                previewDiv.style.cssText = 'margin-top:0.5rem; position:relative; display:inline-block;';
                                                previewDiv.innerHTML = `<div class="resizable-image-container">
                                                        <img src="${ev.target.result}" class="resizable-image" alt="Изображение">
                                                        <div class="resize-handle"></div>
                                                    </div>
                                                    <button type="button" class="${inputSelector.replace('.', '').replace('-image', '-image-remove')}" style="position:absolute; top:-8px; right:-8px; width:24px; height:24px; border-radius:50%; background:#b91c1c; color:white; border:none; cursor:pointer; font-size:14px; line-height:24px; text-align:center;">×</button>`;
                                                // Вставляем после контейнера с кнопкой загрузки
                                                const uploadContainer = block.querySelector(inputSelector === '.q-image' ? '.q-image-upload' : '.q-expl-image-upload')?.closest('div');
                                                if (uploadContainer && uploadContainer.parentNode) {
                                                    uploadContainer.parentNode.insertBefore(previewDiv, uploadContainer.nextSibling);
                                                } else {
                                                    block.appendChild(previewDiv);
                                                }
                                                // Обновляем текст статуса
                                                const statusSpan2 = block.querySelector(inputSelector === '.q-image' ? '.q-image-upload' : '.q-expl-image-upload');
                                                if (statusSpan2) {
                                                    const parent = statusSpan2.parentElement;
                                                    const oldStatus = parent.querySelector('span');
                                                    if (oldStatus) oldStatus.textContent = '✅ файл загружен';
                                                }
                                                // Навешиваем обработчик на кнопку удаления
                                                const removeBtn = previewDiv.querySelector('.' + inputSelector.replace('.', '').replace('-image', '-image-remove'));
                                                if (removeBtn) {
                                                    removeBtn.addEventListener('click', () => {
                                                        const textInput = block.querySelector(inputSelector);
                                                        if (textInput) textInput.value = '';
                                                        markChanged();
                                                        previewDiv.remove();
                                                        const statusSpan3 = block.querySelector(inputSelector === '.q-image' ? '.q-image-upload' : '.q-expl-image-upload');
                                                        if (statusSpan3) {
                                                            const parent = statusSpan3.parentElement;
                                                            const oldStatus = parent.querySelector('span');
                                                            if (oldStatus) oldStatus.textContent = 'файл не выбран';
                                                        }
                                                    });
                                                }
                                                console.log('Preview created and inserted successfully');
                                            }
                                        } else {
                                            console.log('textInput NOT found!');
                                        }
                                        console.log('reader.onload END successfully');
                                    } catch (err) {
                                        console.error('ERROR in reader.onload:', err);
                                        showError('Ошибка при загрузке изображения: ' + err.message);
                                    }
                                };
                                reader.onerror = () => {
                                    console.error('FileReader error event');
                                    showError('Ошибка при чтении файла. Попробуйте другой файл.');
                                };
                                reader.readAsDataURL(file);
                            };
                            input.click();
                        });
                    });
                }
                // Функция удаления изображения
                function setupImageRemove(btnSelector, inputSelector) {
                    container.querySelectorAll(btnSelector).forEach(btn => {
                        btn.addEventListener('click', () => {
                            const block = btn.closest('.question-block');
                            const textInput = block.querySelector(inputSelector);
                            if (textInput) textInput.value = '';
                            markChanged();
                            // Вместо полного перерендера — очищаем превью для этого блока
                            const previewContainer = block.querySelector(inputSelector.replace('.q-', '.q-').replace('-image', '-image-preview'));
                            if (previewContainer) {
                                previewContainer.innerHTML = '';
                            }
                            // Обновляем текст статуса
                            const statusSpan = block.querySelector(inputSelector === '.q-image' ? '.q-image-upload' : '.q-expl-image-upload');
                            if (statusSpan) {
                                const parent = statusSpan.parentElement;
                                const oldStatus = parent.querySelector('span');
                                if (oldStatus) oldStatus.textContent = 'файл не выбран';
                            }
                        });
                    });
                }
                // Загрузка изображения к заданию
                setupImageUpload('.q-image-upload', '.q-image');
                // Удаление изображения к заданию
                setupImageRemove('.q-image-remove', '.q-image');
                // Загрузка изображения к объяснению
                setupImageUpload('.q-expl-image-upload', '.q-expl-image');
                // Удаление изображения к объяснению
                setupImageRemove('.q-expl-image-remove', '.q-expl-image');
            }
            backdrop.querySelector('#topicTitle').addEventListener('input', markChanged);
            backdrop.querySelector('#topicTheory').addEventListener('input', markChanged);
            backdrop.querySelector('#topicTimeLimit').addEventListener('input', markChanged);
            backdrop.querySelector('#questionsPerTest').addEventListener('input', markChanged);
            backdrop.querySelector('#randomOrder').addEventListener('change', markChanged);
            backdrop.querySelector('#addQuestionBtn').addEventListener('click', ()=>{ collectTestData(); topic.test.push({ type:'open', question:'', correctAnswer:'', explanation:'', timeLimit:null, image:'', explanationImage:'' }); renderTest(); markChanged(); });
            async function closeEditor() { if (hasUnsavedChanges && !confirm('Есть несохранённые изменения. Закрыть?')) return; clearInterval(autoSaveInterval); backdrop.remove(); }
            backdrop.querySelector('#closeEditorBtn').onclick = closeEditor;
            backdrop.querySelector('#closeEditorBtn2').onclick = closeEditor;
            backdrop.addEventListener('click', e=>{ if(e.target===backdrop) closeEditor(); });
            saveBtn.addEventListener('click', saveTopicData);
            autoSaveInterval = setInterval(async ()=>{ if (hasUnsavedChanges && !isSaving) await saveTopicData(); }, 15000);
            renderTest();
            if (!topicId) markChanged();
        }

        // ===================== НАСТРОЙКИ =====================
        function renderSettingsTab() {
            const app = document.getElementById('app');
            app.innerHTML = `<div class="section-title">⚙️ Настройки</div><p><strong>ID учителя:</strong> ${teacherId}</p><div style="margin-top: 2rem; margin-bottom: 2rem;"><button class="btn danger" id="resetTeacherBtn">Сбросить всё</button></div>
            <div class="settings-section"><h3 class="section-toggle">📦 Обновление программы ▾</h3><div class="section-content"><p>Загрузите HTML-файл с новой версией программы для учеников.</p><div style="display:flex; gap:1rem; align-items:center; margin-bottom:2.5rem;">
                            <input type="file" id="updateFileInput" accept=".html" style="width:auto;"><span>Текущая версия: <strong id="currentVersion">—</strong></span></div><div style="margin-bottom:1.5rem;"><label>Отправить выбранным ученикам:</label><select id="studentSelect" multiple style="width:100%; height:100px;"></select></div><button class="btn" id="pushUpdateBtn" disabled style="margin-top:1rem;">Загрузить и отправить обновление</button>
                        <p id="fileError" style="color:#b91c1c; margin-top:0.5rem;"></p></div></div>
            <div class="settings-section"><h3 class="section-toggle">💾 Резервное копирование и перенос ▾</h3><div class="section-content">
                <p style="margin-bottom:1rem;">Экспорт создаёт файл со всеми данными (ученики, темы, коды доступа, цитаты).<br>Импорт загружает данные из такого файла в текущий аккаунт учителя.</p>
                <div style="display:flex; gap:1rem; flex-wrap:wrap; margin-top:1rem;">
                    <button class="btn" id="exportDataBtn">📤 Экспортировать данные</button>
                    <button class="btn outline" id="importDataBtn">📥 Импортировать данные из файла</button>
                </div>
                <div id="importStatus" style="margin-top:1rem; font-size:0.9rem;"></div>
            </div></div>
            </div></div>
            <div class="settings-section"><h3 class="section-toggle">🧹 Очистка дубликатов ▾</h3><div class="section-content">
                <p style="margin-bottom:1rem;">Дубликатом считается запись в истории ответов ученика, сделанная в течение <strong>8 секунд</strong> после предыдущей по тому же вопросу.</p>
                <p style="margin-bottom:1rem; color:var(--text-secondary); font-size:0.9rem;">Очистка удаляет дубликаты и пересчитывает correctCount на основе auditLog. <strong>Уровни учеников НЕ сбрасываются</strong>, но прогресс может стать отрицательным — ученику нужно будет добить разницу. Учитывается бонус за первый правильный ответ (fast track: 3 вместо 4).</p>
                <div style="display:flex; gap:1rem; flex-wrap:wrap; margin-top:1rem;">
                    <button class="btn" id="backupBtn">💾 Создать резерв</button>
                    <button class="btn" id="cleanDupesBtn">🧹 Очистить дубликаты</button>
                    <button class="btn outline" id="restoreBackupBtn">⏪ Восстановить из резерва</button>
                </div>
                <div id="cleanupStatus" style="margin-top:1rem; font-size:0.9rem; white-space:pre-wrap;"></div>
            </div></div>
            <div class="settings-section"><h3 class="section-toggle">🎨 Настройки цитат и изображений ▾</h3><div class="section-content"><div id="quotesSettings"></div><button class="btn" id="saveQuotes" style="margin-top:1.5rem;">Сохранить настройки цитат</button></div></div>`;
            document.getElementById('resetTeacherBtn').onclick = ()=>{if(confirm('Создать новый ID?')){localStorage.removeItem('teacher_id');location.reload();}};
            
            // === ЭКСПОРТ ДАННЫХ ===
            document.getElementById('exportDataBtn').onclick = async () => {
                try {
                    const snapshot = await get(ref(db, `teachers/${teacherId}`));
                    const allData = snapshot.val() || {};
                    
                    // Удаляем чувствительные данные (соль, хэш, ID учителя)
                    delete allData._salt;
                    delete allData._hash;
                    
                    // Создаём файл для скачивания
                    const dataStr = JSON.stringify(allData, null, 2);
                    const blob = new Blob([dataStr], {type: 'application/json'});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `forestudy_backup_${new Date().toISOString().slice(0,19)}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    alert('✅ Данные экспортированы! Файл сохранён.');
                } catch (error) {
                    console.error(error);
                    alert('Ошибка экспорта: ' + error.message);
                }
            };
            
            // === ИМПОРТ ДАННЫХ ===
            const importStatus = document.getElementById('importStatus');
            
            function showImportMessage(msg, isError = false) {
                importStatus.innerHTML = `<span style="color: ${isError ? '#ef4444' : '#10b981'};">${msg}</span>`;
                setTimeout(() => { importStatus.innerHTML = ''; }, 5000);
            }
            
            // Создаём скрытый input для выбора файла
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'application/json';
            fileInput.style.display = 'none';
            document.body.appendChild(fileInput);
            
            document.getElementById('importDataBtn').onclick = () => {
                fileInput.click();
            };
            
            fileInput.onchange = async (event) => {
                const file = event.target.files[0];
                if (!file) return;
                
                try {
                    const text = await file.text();
                    const importData = JSON.parse(text);
                    
                    // Проверяем, что файл содержит данные учителя (хотя бы один из ожидаемых узлов)
                    const expectedNodes = ['students', 'topics', 'accessCodes', 'quotesSettings', 'appVersion'];
                    const hasAnyNode = expectedNodes.some(node => importData[node]);
                    if (!hasAnyNode) {
                        showImportMessage('❌ Неверный формат файла. Нет данных учеников, тем или кодов доступа.', true);
                        fileInput.value = '';
                        return;
                    }
                    
                    const confirmImport = confirm(`Импортировать данные?\n\nБудут добавлены/обновлены:\n- Ученики\n- Темы\n- Коды доступа\n- Цитаты\n- Версия приложения\n\nСуществующие данные НЕ будут удалены, только дополнены. Продолжить?`);
                    if (!confirmImport) {
                        fileInput.value = '';
                        return;
                    }
                    
                    // Импортируем каждый узел (слияние, а не замена)
                    const nodesToImport = ['students', 'topics', 'accessCodes', 'quotesSettings', 'appVersion'];
                    let importedCount = 0;
                    
                    for (const node of nodesToImport) {
                        if (importData[node] && Object.keys(importData[node]).length > 0) {
                            // Получаем текущие данные узла
                            const currentSnap = await get(ref(db, `teachers/${teacherId}/${node}`));
                            const currentData = currentSnap.val() || {};
                            
                            // Объединяем (импортированные данные перезаписывают существующие при конфликте)
                            const mergedData = { ...currentData, ...importData[node] };
                            await set(ref(db, `teachers/${teacherId}/${node}`), mergedData);
                            importedCount++;
                            console.log(`✅ Импортирован узел: ${node}`);
                        }
                    }
                    
                    showImportMessage(`✅ Импорт завершён! Импортировано ${importedCount} разделов. Страница будет перезагружена.`);
                    setTimeout(() => location.reload(), 2000);
                } catch (error) {
                    console.error(error);
                    showImportMessage('❌ Ошибка при импорте: ' + error.message, true);
                } finally {
                    fileInput.value = '';
                }
            };
            
            
            // ===================== РЕЗЕРВ, ОЧИСТКА ДУБЛИКАТОВ, ВОССТАНОВЛЕНИЕ =====================
            const cleanupStatus = document.getElementById('cleanupStatus');
            function showCleanupMessage(msg, isError = false) {
                cleanupStatus.innerHTML = `<span style="color: ${isError ? '#ef4444' : '#10b981'};">${msg}</span>`;
            }

            // 1. Кнопка "Создать резерв"
            document.getElementById('backupBtn').onclick = async () => {
                if (!confirm('Создать резервную копию всех данных учителя в Firebase?')) return;
                try {
                    const snapshot = await get(ref(db, `teachers/${teacherId}`));
                    const allData = snapshot.val() || {};
                    const backupKey = 'backup_' + Date.now();
                    await set(ref(db, `teachers/${teacherId}/_backups/${backupKey}`), allData);
                    showCleanupMessage(`✅ Резервная копия создана! Ключ: ${backupKey}`);
                } catch (error) {
                    showCleanupMessage('❌ Ошибка создания резерва: ' + error.message, true);
                }
            };

            // 2. Кнопка "Очистить дубликаты"
            document.getElementById('cleanDupesBtn').onclick = async () => {
                if (!confirm('Запустить очистку дубликатов?\n\nБудут удалены записи в истории ответов, сделанные в течение 8 секунд после предыдущей по тому же вопросу.\n\ncorrectCount будет пересчитан с учётом auditLog. Уровни учеников НЕ изменятся, но прогресс может стать отрицательным, если после удаления дублей не хватает баллов для текущего уровня.')) return;
                
                const btn = document.getElementById('cleanDupesBtn');
                btn.disabled = true;
                btn.textContent = '⏳ Очистка...';
                showCleanupMessage('⏳ Идёт очистка...');
                
                try {
                    const DUPES_WINDOW_MS = 8000; // 8 секунд
                    const studentsSnap = await get(ref(db, `teachers/${teacherId}/students`));
                    const students = studentsSnap.val() || {};
                    // Загружаем auditLog для анализа levelUp
                    const auditSnap = await get(ref(db, `teachers/${teacherId}/auditLog`));
                    const auditLog = auditSnap.val() || {};
                    
                    let totalDupesRemoved = 0;
                    let totalStudentsProcessed = 0;
                    let totalQuestionsProcessed = 0;
                    let totalLevelAdjustments = 0;
                    let reportLines = [];
                    
                    // Группируем auditLog по studentId + topicId, сортируем по timestamp
                    const auditByStudentTopic = {};
                    for (const [key, entry] of Object.entries(auditLog)) {
                        if (entry.type !== 'levelUp') continue;
                        const stKey = entry.studentId + '|' + entry.topicId;
                        if (!auditByStudentTopic[stKey]) auditByStudentTopic[stKey] = [];
                        auditByStudentTopic[stKey].push({ ...entry, auditKey: key });
                    }
                    // Сортируем каждую группу по timestamp
                    for (const key of Object.keys(auditByStudentTopic)) {
                        auditByStudentTopic[key].sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                    }
                    
                    for (const [uid, student] of Object.entries(students)) {
                        const tp = student.topicProgress || {};
                        let studentDupes = 0;
                        let studentQuestionsProcessed = 0;
                        let studentLevelAdjustments = 0;
                        
                        for (const [topicId, topicProg] of Object.entries(tp)) {
                            const questions = topicProg.questions || {};
                            
                            // Получаем levelUp события для этого ученика/темы из auditLog
                            const stKey = uid + '|' + topicId;
                            const levelUpEvents = auditByStudentTopic[stKey] || [];
                            
                            // Определяем levelUpAt для каждого уровня
                            // levelUpEvents[0] = переход на уровень 2, levelUpEvents[1] = на уровень 3, и т.д.
                            const currentLevel = topicProg.level || 1;
                            
                            // Собираем все levelUpAt, которые были до текущего уровня
                            // Если текущий уровень N, то было N-1 повышений
                            const levelUpAtList = [];
                            for (let i = 0; i < levelUpEvents.length && i < currentLevel - 1; i++) {
                                levelUpAtList.push(levelUpEvents[i].timestamp);
                            }
                            
                            for (const [qKey, qData] of Object.entries(questions)) {
                                const history = qData.history || [];
                                if (history.length < 2) continue;
                                
                                studentQuestionsProcessed++;
                                
                                // Сортируем историю по времени (по возрастанию)
                                const sorted = [...history].sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                                
                                // Отмечаем дубликаты: записи, которые находятся в пределах 8 секунд от предыдущей
                                const toRemove = new Set();
                                for (let i = 1; i < sorted.length; i++) {
                                    const prev = sorted[i - 1];
                                    const curr = sorted[i];
                                    const diff = (curr.timestamp || 0) - (prev.timestamp || 0);
                                    if (diff >= 0 && diff <= DUPES_WINDOW_MS) {
                                        toRemove.add(curr);
                                    }
                                }
                                
                                if (toRemove.size > 0) {
                                    // Фильтруем: оставляем только те записи, которых нет в toRemove
                                    const filtered = sorted.filter(rec => {
                                        for (const dup of toRemove) {
                                            if (dup.timestamp === rec.timestamp && dup.userAnswer === rec.userAnswer && dup.correct === rec.correct) {
                                                return false;
                                            }
                                        }
                                        return true;
                                    });
                                    
                                    // ПЕРЕСЧИТЫВАЕМ correctCount КАК УЧЕНИК (с учётом levelUp из auditLog)
                                    // Проходим историю от лица ученика: +1 за правильный, -1 за ошибку
                                    // При levelUp сбрасываем correctCount в 0
                                    // После levelUp вычитаем дефицит (сколько не хватило до levelUp)
                                    
                                    let recalcCorrectCount = 0;
                                    let recalcModifier = 0;
                                    let recalcFastTrack = false;
                                    let recalcFirst = false;
                                    let totalDeficit = 0; // сколько баллов не хватило до levelUp
                                    
                                    // Собираем все levelUp timestamps для этого ученика+темы
                                    const levelUpTimestamps = levelUpAtList.slice(); // уже отсортированы
                                    let nextLevelUpIdx = 0; // индекс следующего levelUp
                                    
                                    for (const hRec of filtered) {
                                        // Проверяем, не наступил ли levelUp перед этой записью
                                        while (nextLevelUpIdx < levelUpTimestamps.length && 
                                               (hRec.timestamp || 0) >= levelUpTimestamps[nextLevelUpIdx]) {
                                            // LevelUp! Считаем дефицит: сколько не хватило до maxNeeded
                                            const maxForLevel = recalcFastTrack ? 3 : 4;
                                            const deficit = Math.max(0, maxForLevel - recalcCorrectCount);
                                            totalDeficit += deficit;
                                            
                                            // Сначала сбрасываем correctCount в 0 при переходе на новый уровень
                                            recalcCorrectCount = 0;
                                            recalcModifier = 0;
                                            recalcFastTrack = false;
                                            recalcFirst = false;
                                            // Потом вычитаем дефицит с прошлого уровня из счёта на новом уровне
                                            recalcCorrectCount = recalcCorrectCount - deficit;
                                            nextLevelUpIdx++;
                                        }
                                        
                                        if (!recalcFirst) {
                                            recalcFirst = true;
                                            if (hRec.correct) recalcFastTrack = true;
                                        }
                                        
                                        if (hRec.correct) {
                                            recalcCorrectCount++;
                                            recalcModifier = Math.max(0, recalcModifier - 20);
                                        } else {
                                            recalcCorrectCount = Math.max(0, recalcCorrectCount - 1);
                                            recalcModifier = Math.min(60, recalcModifier + 20);
                                            recalcFastTrack = false;
                                        }
                                    }
                                    
                                    // Проверяем, не было ли levelUp ПОСЛЕ последней записи в истории
                                    while (nextLevelUpIdx < levelUpTimestamps.length) {
                                        const maxForLevel = recalcFastTrack ? 3 : 4;
                                        const deficit = Math.max(0, maxForLevel - recalcCorrectCount);
                                        totalDeficit += deficit;
                                        // Сначала сбрасываем correctCount в 0 при переходе на новый уровень
                                        recalcCorrectCount = 0;
                                        recalcModifier = 0;
                                        recalcFastTrack = false;
                                        recalcFirst = false;
                                        // Потом вычитаем дефицит с прошлого уровня из счёта на новом уровне
                                        recalcCorrectCount = recalcCorrectCount - deficit;
                                        nextLevelUpIdx++;
                                    }
                                    
                                    // Ограничиваем сверху maxNeeded (но не снизу — может быть отрицательным)
                                    const recalcMaxNeeded = recalcFastTrack ? 3 : 4;
                                    if (recalcCorrectCount > recalcMaxNeeded) {
                                        recalcCorrectCount = recalcMaxNeeded;
                                    }
                                    
                                    // Проверяем, изменился ли correctCount относительно старого
                                    const oldCorrectCount = qData.correctCount || 0;
                                    const diff = recalcCorrectCount - oldCorrectCount;
                                    
                                    // Сохраняем обратно
                                    qData.history = filtered;
                                    qData.correctCount = recalcCorrectCount;
                                    qData.modifier = recalcModifier;
                                    qData.firstCorrect = recalcFastTrack;
                                    
                                    if (diff < 0) {
                                        studentLevelAdjustments++;
                                        // Добавляем информацию о конкретном вопросе
                                        const qText = qKey.replace(/^q_/, '').substring(0, 60);
                                        reportLines.push(`  📌 Вопрос: "${escapeHtml(qText)}" — было ${oldCorrectCount}, стало ${recalcCorrectCount} (удалено ${toRemove.size} дублей)`);
                                    }
                                    
                                    studentDupes += toRemove.size;
                                }
                            }
                        }
                        
                        if (studentDupes > 0 || studentLevelAdjustments > 0) {
                            totalDupesRemoved += studentDupes;
                            totalStudentsProcessed++;
                            totalQuestionsProcessed += studentQuestionsProcessed;
                            totalLevelAdjustments += studentLevelAdjustments;
                            let line = `👤 ${escapeHtml(student.name || uid)}: удалено ${studentDupes} дубликатов`;
                            if (studentLevelAdjustments > 0) {
                                line += `, скорректировано ${studentLevelAdjustments} вопросов (прогресс уменьшен)`;
                            }
                            reportLines.push(line);
                        }
                    }
                    
                    // Сохраняем обновлённые данные обратно в Firebase
                    if (totalDupesRemoved > 0 || totalLevelAdjustments > 0) {
                        await set(ref(db, `teachers/${teacherId}/students`), students);
                        let msg = `✅ Очистка завершена!\n` +
                            `Удалено дубликатов: ${totalDupesRemoved}\n` +
                            `Затронуто учеников: ${totalStudentsProcessed}\n` +
                            `Затронуто вопросов: ${totalQuestionsProcessed}\n`;
                        if (totalLevelAdjustments > 0) {
                            msg += `Скорректировано вопросов (прогресс ↓): ${totalLevelAdjustments}\n`;
                            msg += `⚠️ Уровни учеников сохранены. Ученикам нужно добить разницу.\n`;
                        }
                        msg += `\n📋 Детали:\n${reportLines.join('\n')}`;
                        showCleanupMessage(msg);
                    } else {
                        showCleanupMessage('✅ Дубликатов не найдено. Все записи уникальны.');
                    }
                } catch (error) {
                    showCleanupMessage('❌ Ошибка при очистке: ' + error.message, true);
                } finally {
                    btn.disabled = false;
                    btn.textContent = '🧹 Очистить дубликаты';
                }
            };

            // 3. Кнопка "Восстановить из резерва"
            document.getElementById('restoreBackupBtn').onclick = async () => {
                try {
                    // Получаем список резервных копий
                    const backupsSnap = await get(ref(db, `teachers/${teacherId}/_backups`));
                    const backups = backupsSnap.val() || {};
                    const backupKeys = Object.keys(backups).sort().reverse();
                    
                    if (backupKeys.length === 0) {
                        showCleanupMessage('❌ Нет сохранённых резервных копий.', true);
                        return;
                    }
                    
                    // Показываем диалог выбора резерва
                    const backdrop = document.createElement('div'); backdrop.className = 'modal-backdrop';
                    backdrop.innerHTML = `
                        <div class="modal-content" style="max-width:500px;">
                            <button class="modal-close">&times;</button>
                            <h3>⏪ Восстановление из резерва</h3>
                            <p style="margin:1rem 0;">Выберите резервную копию для восстановления:</p>
                            <select id="backupSelect" style="width:100%; padding:0.5rem; margin-bottom:1rem;">
                                ${backupKeys.map(key => {
                                    const date = new Date(parseInt(key.replace('backup_', ''))).toLocaleString('ru-RU');
                                    return `<option value="${key}">${date} (${key})</option>`;
                                }).join('')}
                            </select>
                            <p style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:1rem;">
                                ⚠️ Все текущие данные будут <strong>полностью заменены</strong> данными из резервной копии.
                            </p>
                            <div style="display:flex; gap:0.5rem;">
                                <button class="btn danger" id="confirmRestoreBtn">⏪ Восстановить</button>
                                <button class="btn outline" id="cancelRestoreBtn">Отмена</button>
                            </div>
                            <div id="restoreStatus" style="margin-top:1rem;"></div>
                        </div>
                    `;
                    document.body.appendChild(backdrop);
                    
                    backdrop.querySelector('.modal-close').onclick = () => backdrop.remove();
                    backdrop.querySelector('#cancelRestoreBtn').onclick = () => backdrop.remove();
                    backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.remove(); });
                    
                    backdrop.querySelector('#confirmRestoreBtn').onclick = async () => {
                        const selectedKey = backdrop.querySelector('#backupSelect').value;
                        if (!selectedKey) return;
                        
                        if (!confirm(`ВНИМАНИЕ! Все текущие данные будут заменены данными из резервной копии ${selectedKey}.\n\nЭто действие нельзя отменить через интерфейс. Продолжить?`)) return;
                        
                        try {
                            const restoreBtn = backdrop.querySelector('#confirmRestoreBtn');
                            restoreBtn.disabled = true;
                            restoreBtn.textContent = '⏳ Восстановление...';
                            
                            const backupData = backups[selectedKey];
                            
                            // Восстанавливаем все узлы, кроме _salt, _hash и _backups
                            const nodesToRestore = ['students', 'topics', 'accessCodes', 'quotesSettings', 'appVersion'];
                            for (const node of nodesToRestore) {
                                if (backupData[node] !== undefined) {
                                    await set(ref(db, `teachers/${teacherId}/${node}`), backupData[node]);
                                }
                            }
                            
                            backdrop.querySelector('#restoreStatus').innerHTML = '<span style="color:#10b981;">✅ Восстановление завершено! Страница будет перезагружена.</span>';
                            setTimeout(() => { backdrop.remove(); location.reload(); }, 2000);
                        } catch (error) {
                            backdrop.querySelector('#restoreStatus').innerHTML = `<span style="color:#ef4444;">❌ Ошибка: ${error.message}</span>`;
                            const restoreBtn = backdrop.querySelector('#confirmRestoreBtn');
                            restoreBtn.disabled = false;
                            restoreBtn.textContent = '⏪ Восстановить';
                        }
                    };
                } catch (error) {
                    showCleanupMessage('❌ Ошибка при загрузке списка резервов: ' + error.message, true);
                }
            };

            // === КНОПКА ПЕРЕНОСА ДАННЫХ ИЗ СТАРОГО УЧИТЕЛЯ ===
            const transferBtn = document.createElement('button');
            transferBtn.textContent = '📦 Перенести данные из другого учителя';
            transferBtn.className = 'btn outline';

uerySelector(`.author-${r.key}`).value, img: document.querySelector(`.img-${r.key}`).value, bgSize: document.querySelector(`.bgSize-${r.key}`).value, bgPosX: document.querySelector(`.bgX-${r.key}`).value, bgPosY: document.querySelector(`.bgY-${r.key}`).value }; }); await set(ref(db,`teachers/${teacherId}/quotesSettings`), ns); alert('Сохранено!'); }; }); }
        // ===================== ЖУРНАЛ СОБЫТИЙ (auditLog) =====================
        async function renderAuditLogTab() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="section-title">📋 Журнал событий</div>
                <div style="display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap;">
                    <button class="btn" id="addLevelUpBtn">➕ Добавить запись</button>
                    <button class="btn outline" id="refreshAuditBtn">🔄 Обновить</button>
                </div>
                <div id="auditLogList"></div>
            `;

            document.getElementById('addLevelUpBtn').onclick = () => showAddLevelUpDialog();
            document.getElementById('refreshAuditBtn').onclick = () => renderAuditLogTab();

            const auditRef = ref(db, `teachers/${teacherId}/auditLog`);
            onValue(auditRef, snap => {
                const entries = snap.val() || {};
                const listDiv = document.getElementById('auditLogList');
                if (!listDiv) return;

                const sorted = Object.entries(entries)
                    .map(([key, entry]) => ({ key, ...entry }))
                    .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                if (!sorted.length) {
                    listDiv.innerHTML = '<div class="empty-message">Журнал событий пуст.</div>';
                    return;
                }

                listDiv.innerHTML = sorted.map(entry => {
                    const date = new Date(entry.timestamp).toLocaleString('ru-RU');
                    const isLevelUp = entry.type === 'levelUp';
                    const isLevelDown = entry.type === 'levelDown';
                    const isManual = entry.manual === true;
                    const isApplied = entry.applied === true;
                    let badgeClass = isLevelUp ? 'levelUp' : (isManual ? 'manual' : '');
                    if (isLevelDown) badgeClass = 'levelDown';
                    if (isApplied) badgeClass += ' applied';
                    let badgeText = isLevelUp ? 'Повышение уровня' : (isManual ? 'Ручная запись' : 'Событие');
                    if (isLevelDown) badgeText = 'Понижение уровня';
                    const studentName = entry.studentName || entry.studentId || '—';
                    const topicName = entry.topicName || entry.topicId || '—';
                    const level = entry.newLevel || entry.level || '?';
                    const desc = entry.description || (isLevelDown
                        ? `Ученик "${studentName}" понижен до уровня ${level} по теме "${topicName}"`
                        : `Ученик "${studentName}" получил уровень ${level} по теме "${topicName}"`);

                    // Строка с отметкой о применении (для applied-записей)
                    let appliedMarkHtml = '';
                    if (isApplied) {
                        appliedMarkHtml = `<div class="audit-applied-mark">✅ Изменение отмечено в базе</div>`;
                    }

                    // Кнопка "Применить" (для неприменённых записей levelUp/levelDown)
                    let applyBtnHtml = '';
                    if ((isLevelUp || isLevelDown) && !isApplied) {
                        applyBtnHtml = `<button class="btn outline" style="font-size:0.75rem; padding:0.2rem 0.6rem; margin-top:0.3rem;" data-apply-key="${entry.key}" data-apply-student="${entry.studentId}" data-apply-topic="${entry.topicId}" data-apply-level="${level}">🔄 Применить</button>`;
                    }

                    return `<div class="audit-entry ${badgeClass}">
                        <div class="audit-time">${date}</div>
                        <div class="audit-desc">${escapeHtml(desc)}</div>
                        <div><span class="audit-badge ${badgeClass}">${badgeText}</span></div>
                        <div style="font-size:0.8rem; color:var(--text-secondary); margin-top:0.3rem;">
                            Ученик: ${escapeHtml(studentName)} · Тема: ${escapeHtml(topicName)} · Уровень: ${level}
                        </div>
                        ${appliedMarkHtml}
                        ${applyBtnHtml}
                    </div>`;
                }).join('');

                // Навешиваем обработчики на кнопки "Применить"
                listDiv.querySelectorAll('[data-apply-key]').forEach(btn => {
                    btn.onclick = async () => {
                        const entryKey = btn.dataset.applyKey;
                        const studentId = btn.dataset.applyStudent;
                        const topicId = btn.dataset.applyTopic;
                        const level = parseInt(btn.dataset.applyLevel);
                        if (!entryKey || !studentId || !topicId || !level) return;

                        btn.disabled = true;
                        btn.textContent = '⏳ Применяю...';

                        try {
                            // Обновляем уровень ученика в topicProgress
                            const studentRef = ref(db, `teachers/${teacherId}/students/${studentId}/topicProgress/${topicId}`);
                            await update(studentRef, { level: level });

                            // Помечаем запись как applied
                            const entryRef = ref(db, `teachers/${teacherId}/auditLog/${entryKey}`);
                            await update(entryRef, { applied: true });

                            btn.textContent = '✅ Применено';
                            btn.style.color = '#10b981';
                            btn.style.borderColor = '#10b981';
                            setTimeout(() => renderAuditLogTab(), 1000);
                        } catch (error) {
                            btn.textContent = '❌ Ошибка';
                            btn.disabled = false;
                            setTimeout(() => { btn.textContent = '🔄 Применить'; btn.disabled = false; }, 2000);
                        }
                    };
                });
            });
        }
